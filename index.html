{id:'c5-p23',sec:'c51',no:'৫.১ — ২৩',k:'e',gist:'গাড়ির দুই বেগে মোট 240 কি.মি.',
 q:'একটি গাড়ি ঘণ্টায় 60 কি.মি. বেগে কিছু পথ এবং ঘণ্টায় 40 কি.মি. বেগে অবশিষ্ট পথ অতিক্রম করলো। গাড়িটি মোট 5 ঘণ্টায় 240 কি.মি. পথ অতিক্রম করলে, ঘণ্টায় 60 কি.মি. বেগে কতদূর গিয়েছে?',
 f:['দূরত্ব = বেগ × সময়'],
 idea:'60 কি.মি. বেগে t ঘণ্টা চললে বাকি (5 − t) ঘণ্টা 40 কি.মি. বেগে।',
 dia:()=>D.hbars({rows:[{l:'মোট সময় 5 ঘণ্টা',seg:[{w:1,t:'t ঘণ্টা (60 কি.মি./ঘ.)',k:'o'},{w:1.4,t:'(5 − t) ঘণ্টা (40 কি.মি./ঘ.)',k:'g'}]},{l:'মোট দূরত্ব 240 কি.মি.',seg:[{w:1,t:'60t',k:'o'},{w:1.4,t:'40(5 − t)',k:'g'}]}]}),
 steps:[['সমীকরণ','60t + 40(5 − t) = 240'],['সরল','60t + 200 − 40t = 240 ⟹ 20t = 40 ⟹ t = 2'],['দূরত্ব','60 × 2 = 120 কি.মি.']],
 chk:'যাচাই: বাকি 3 ঘণ্টায় 3 × 40 = 120, মোট 240 ✓',
 ans:[{l:'60 কি.মি./ঘ. বেগে',v:120,u:'কি.মি.'}],fin:'120 কি.মি.'},

{id:'c5-p24',sec:'c51',no:'৫.১ — ২৪',k:'e',gist:'সজল ও কাজল কোথায় মিলিত হবে',
 q:'ঢাকার নিউমার্কেট থেকে গাবতলির দূরত্ব 12 কি.মি.। সজল নিউমার্কেট থেকে রিক্সায় ঘণ্টায় 6 কি.মি. বেগে এবং কাজল একই স্থান থেকে পায়ে হেঁটে ঘণ্টায় 4 কি.মি. বেগে গাবতলির দিকে রওনা হলো। সজল গাবতলি পৌঁছে সেখানে 30 মিনিট বিশ্রাম নিয়ে আবার নিউমার্কেটের দিকে একই বেগে রওনা হলো। তারা নিউমার্কেট থেকে কতদূরে মিলিত হবে?',
 f:['বিপরীত দিকে চললে মিলিত বেগ = বেগের যোগফল','সময় = দূরত্ব ÷ বেগ'],
 idea:'সজল যখন ফেরার জন্য রওনা দেয় তখন কাজল কতদূরে? সেই দূরত্বটাই দুজনের মধ্যে ফাঁক। তারপর মিলিত বেগে ফাঁক পূরণ।',
 dia:()=>D.meet({}),
 steps:[['সজলের সময়','12 ÷ 6 = 2 ঘণ্টা। 30 মিনিট বিশ্রামের পর ফেরা শুরু হয় 2.5 ঘণ্টায়'],['কাজলের অবস্থান','4 × 2.5 = 10 কি.মি., অর্থাৎ গাবতলি থেকে 2 কি.মি. দূরে'],['মিলিত বেগ','6 + 4 = 10 কি.মি./ঘণ্টা ⟹ মিলতে 2 ÷ 10 = 0.2 ঘণ্টা'],['মিলনস্থান','কাজল আরও 4 × 0.2 = 0.8 কি.মি. হাঁটে ⟹ 10 + 0.8 = 10.8']],
 chk:'যাচাই: সজল গাবতলি থেকে 6 × 0.2 = 1.2 কি.মি. ফিরেছে, 12 − 1.2 = 10.8 ✓',
 ans:[{l:'নিউমার্কেট থেকে দূরত্ব',v:10.8,u:'কি.মি.'}],fin:'নিউমার্কেট থেকে 10.8 কি.মি. দূরে'},

{id:'c5-q23',sec:'c52',no:'৫.২ — ২৩',k:'e',gist:'অঙ্কদ্বয়ের সমষ্টি 15, গুণফল 56',
 q:'দুই অঙ্কবিশিষ্ট কোনো সংখ্যার অঙ্কদ্বয়ের সমষ্টি 15 এবং এদের গুণফল 56; সংখ্যাটি কত?',
 f:['এক অঙ্ক x হলে অপর অঙ্ক 15 − x'],
 idea:'যোগফল ও গুণফল দিলে দ্বিঘাত সমীকরণ হয়। অঙ্ক দুটি পেলে কোনটি দশক তা প্রশ্নে বলা নেই, তাই দুটি সংখ্যাই হয়।',
 dia:()=>D.chain({t:['অঙ্ক দুটি x এবং 15 − x',{s:'x(15 − x) = 56 ⟹ x² − 15x + 56 = 0',k:'o'},{s:'(x − 7)(x − 8) = 0 ⟹ অঙ্ক 7 ও 8',k:'o'},{s:'সংখ্যা 78 অথবা 87',k:'g'}],ar:['গুণফল','উৎপাদক','অঙ্ক সাজাই']}),
 steps:[['সমীকরণ','x(15 − x) = 56 ⟹ x² − 15x + 56 = 0'],['উৎপাদক','x² − 7x − 8x + 56 = 0 ⟹ (x − 7)(x − 8) = 0'],['অঙ্ক','x = 7 অথবা 8, তাই অঙ্ক 7 ও 8'],['সংখ্যা','78 অথবা 87']],
 chk:'যাচাই: 7 + 8 = 15, 7 × 8 = 56 ✓',
 ans:[{l:'ছোট সংখ্যাটি',v:78,u:''},{l:'বড় সংখ্যাটি',v:87,u:''}],fin:'সংখ্যাটি 78 অথবা 87'},

{id:'c5-q24',sec:'c52',no:'৫.২ — ২৪',k:'e',gist:'ঘরের মেঝে: দৈর্ঘ্য 4 কমে, প্রস্থ 4 বাড়ে',
 q:'একটি আয়তাকার ঘরের মেঝের ক্ষেত্রফল 192 বর্গমিটার। মেঝের দৈর্ঘ্য 4 মিটার কমালে ও প্রস্থ 4 মিটার বাড়ালে ক্ষেত্রফল অপরিবর্তিত থাকে। মেঝের দৈর্ঘ্য ও প্রস্থ নির্ণয় কর।',
 f:['lw = 192','(l − 4)(w + 4) = 192'],
 idea:'দুটি সমীকরণ থেকে সম্পর্ক l = w + 4 বেরোয়। তারপর একটি চলকের দ্বিঘাত সমীকরণ।',
 dia:()=>D.area_swap({W:'দৈর্ঘ্য l',H:'প্রস্থ w',rm:'দৈর্ঘ্য −4 মি.',ad:'প্রস্থ +4 মি.',cap:'ক্ষেত্রফল অপরিবর্তিত'}),
 steps:[['সমীকরণ','lw = 192 …(1),  (l − 4)(w + 4) = 192 …(2)'],['(2) বিস্তার','lw + 4l − 4w − 16 = 192 ⟹ 4l − 4w = 16 ⟹ l = w + 4'],['(1) এ বসাই','(w + 4)w = 192 ⟹ w² + 4w − 192 = 0'],['উৎপাদক','(w + 16)(w − 12) = 0 ⟹ w = 12'],['দৈর্ঘ্য','l = 12 + 4 = 16']],
 chk:'যাচাই: 16 × 12 = 192 এবং (16 − 4)(12 + 4) = 12 × 16 = 192 ✓',
 ans:[{l:'দৈর্ঘ্য',v:16,u:'মিটার'},{l:'প্রস্থ',v:12,u:'মিটার'}],fin:'দৈর্ঘ্য 16 মিটার, প্রস্থ 12 মিটার'},

{id:'c5-q27',sec:'c52',no:'৫.২ — ২৭',k:'e',gist:'সহপাঠীর সংখ্যার সমান চাঁদা, মোট 420 টাকা',
 q:'একটি শ্রেণিতে যতজন ছাত্র-ছাত্রী পড়ে প্রত্যেকে তার সহপাঠীর সংখ্যার সমান টাকা চাঁদা দেওয়ায় মোট 420 টাকা চাঁদা উঠল। ঐ শ্রেণির ছাত্র-ছাত্রীর সংখ্যা কত এবং প্রত্যেকে কত টাকা করে চাঁদা দিল?',
 f:['সহপাঠী = মোট সংখ্যা − 1 (নিজেকে বাদ দিয়ে)'],
 idea:'n জন হলে প্রত্যেকের সহপাঠী (n − 1) জন, তাই প্রত্যেকে (n − 1) টাকা দেয়। জনসংখ্যা × জনপ্রতি = মোট।',
 dia:()=>D.rect({l:'n জন ছাত্র-ছাত্রী',w:'প্রত্যেকে (n−1) টাকা',area:'মোট 420 টাকা'}),
 steps:[['সমীকরণ','n(n − 1) = 420 ⟹ n² − n − 420 = 0'],['উৎপাদক','n² − 21n + 20n − 420 = 0 ⟹ (n − 21)(n + 20) = 0'],['গ্রহণযোগ্য','n = 21 (−20 হতে পারে না)'],['চাঁদা','21 − 1 = 20 টাকা']],
 chk:'যাচাই: 21 × 20 = 420 ✓',
 ans:[{l:'ছাত্র-ছাত্রী',v:21,u:'জন'},{l:'জনপ্রতি চাঁদা',v:20,u:'টাকা'}],fin:'21 জন, প্রত্যেকে 20 টাকা'},

{id:'c5-q28',sec:'c52',no:'৫.২ — ২৮',k:'e',gist:'চাঁদা পয়সায়, মোট 70 টাকা',
 q:'একটি শ্রেণিতে যতজন ছাত্র-ছাত্রী পড়ে, প্রত্যেকে তত পয়সার চেয়ে আরও 30 পয়সা বেশি করে চাঁদা দেওয়াতে মোট 70 টাকা উঠল। ঐ শ্রেণির ছাত্র-ছাত্রীর সংখ্যা কত?',
 f:['1 টাকা = 100 পয়সা','মোট = জনসংখ্যা × জনপ্রতি'],
 idea:'আগে সব পয়সায় আনি: 70 টাকা = 7000 পয়সা। n জন হলে প্রত্যেকে (n + 30) পয়সা দেয়।',
 dia:()=>D.rect({l:'n জন ছাত্র-ছাত্রী',w:'(n + 30) পয়সা',area:'মোট 7000 পয়সা'}),
 steps:[['একক','70 টাকা = 7000 পয়সা'],['সমীকরণ','n(n + 30) = 7000 ⟹ n² + 30n − 7000 = 0'],['উৎপাদক','n² + 100n − 70n − 7000 = 0 ⟹ (n + 100)(n − 70) = 0'],['গ্রহণযোগ্য','n = 70 (−100 হতে পারে না)']],
 chk:'যাচাই: প্রত্যেকে 100 পয়সা, 70 × 100 = 7000 পয়সা = 70 টাকা ✓',
 ans:[{l:'ছাত্র-ছাত্রী',v:70,u:'জন'}],fin:'70 জন'},

/* ===================== অধ্যায় ১০ ===================== */
{id:'c10-ex4',sec:'c10e',no:'১০ — উদাহরণ ৪',k:'h',gist:'গাছ ঠেস দেওয়া খুঁটির দৈর্ঘ্য',
 q:'ঝড়ে একটি গাছ হেলে পড়লো। গাছের গোড়া থেকে 7 মিটার উচ্চতায় একটি খুঁটি ঠেস দিয়ে গাছটিকে সোজা করা হলো। মাটিতে খুঁটিটির স্পর্শ বিন্দুর অবনতি কোণ 30° হলে, খুঁটিটির দৈর্ঘ্য নির্ণয় কর।',
 f:['sin θ = লম্ব/অতিভুজ','sin 30° = 1/2','অবনতি কোণ = একান্তর কোণ = উন্নতি কোণ'],
 idea:'অবনতি কোণ আর মাটিতে উন্নতি কোণ একান্তর কোণ বলে সমান (30°)। খুঁটি হলো অতিভুজ, 7 মিটার লম্ব। তাই sin ব্যবহার করি।',
 dia:()=>D.elev({ang:30,dep:1,L:{h:'AB = 7 মি.',hyp:'খুঁটি BC = x'}}),
 steps:[['কোণ','∠ACB = ∠DBC = 30° (একান্তর কোণ)'],['সমকোণী △ABC','sin 30° = AB/BC ⟹ 1/2 = 7/BC'],['সমাধান','BC = 14']],
 ans:[{l:'খুঁটির দৈর্ঘ্য',v:14,u:'মিটার'}],fin:'খুঁটির দৈর্ঘ্য 14 মিটার'},

{id:'c10-ex5',sec:'c10e',no:'১০ — উদাহরণ ৫',k:'h',gist:'৪২ মিটার পিছিয়ে উন্নতি কোণ 60° থেকে 45°',
 q:'ভূতলস্থ কোনো স্থানে একটি দালানের ছাদের একটি বিন্দুর উন্নতি কোণ 60°। ঐ স্থান থেকে 42 মিটার পিছিয়ে গেলে দালানের ঐ বিন্দুর উন্নতি কোণ 45° হয়। দালানের উচ্চতা নির্ণয় কর।',
 f:['tan θ = লম্ব/ভূমি','tan 60° = √3,  tan 45° = 1'],
 idea:'দুই জায়গা থেকে দুটি সমকোণী ত্রিভুজ। দুটিতেই লম্ব h। কাছের স্থানের দূরত্ব x ধরলে দূরের স্থানের দূরত্ব x + 42।',
 dia:()=>D.elev2({a1:60,a2:45,L:{h:'h',back:'CD = 42 মি.',x:'BC = x'}}),
 steps:[['কাছের স্থান (60°)','tan 60° = h/x ⟹ x = h/√3 …(1)'],['দূরের স্থান (45°)','tan 45° = h/(x + 42) ⟹ h = x + 42'],['(1) বসাই','h = h/√3 + 42 ⟹ √3h − h = 42√3'],['h বের করি','h = 42√3/(√3 − 1) = 21(3 + √3) ≈ 99.37']],
 chk:'যাচাই: x = 99.37/1.732 = 57.37 এবং x + 42 = 99.37 = h ✓',
 ans:[{l:'দালানের উচ্চতা',v:99.37,u:'মিটার'}],fin:'দালানের উচ্চতা ≈ 99.37 মিটার'},

{id:'c10-ex6',sec:'c10e',no:'১০ — উদাহরণ ৬',k:'h',gist:'ভাঙা খুঁটি, ৩০° কোণ, ১০ মিটার দূরে',
 q:'একটি খুঁটি এমন ভাবে ভেঙে গেল যে, তার অবিচ্ছিন্ন ভাঙা অংশ দণ্ডায়মান অংশের সাথে 30° কোণ উৎপন্ন করে খুঁটির গোড়া থেকে 10 মিটার দূরে মাটি স্পর্শ করে। খুঁটির সম্পূর্ণ দৈর্ঘ্য নির্ণয় কর।',
 f:['tan θ = লম্ব/ভূমি','sin θ = লম্ব/অতিভুজ','tan 30° = 1/√3,  sin 30° = 1/2','সম্পূর্ণ দৈর্ঘ্য = দণ্ডায়মান অংশ + ভাঙা অংশ'],
 idea:'দণ্ডায়মান অংশ BC = x, ভাঙা অংশ CD। দুটোর যোগফলই খুঁটির দৈর্ঘ্য। 30° কোণের বিপরীত বাহু BD = 10, তাই tan ও sin দুটোই কাজে লাগে।',
 dia:()=>D.broken({mode:'apex',ang:30,L:{base:'BD = 10 মি.',st:'x',br:'CD = h − x',tot:'মোট h'}}),
 steps:[['দণ্ডায়মান অংশ','tan 30° = BD/BC ⟹ 1/√3 = 10/x ⟹ x = 10√3'],['ভাঙা অংশ','sin 30° = BD/CD ⟹ 1/2 = 10/CD ⟹ CD = 20'],['সম্পূর্ণ দৈর্ঘ্য','h = x + CD = 10√3 + 20 ≈ 37.32']],
 ans:[{l:'খুঁটির দৈর্ঘ্য',v:37.32,u:'মিটার'}],fin:'খুঁটির দৈর্ঘ্য ≈ 37.32 মিটার'},

{id:'c10-p10',sec:'c10x',no:'১০ — ১০',k:'h',gist:'মিনার থেকে দূরত্ব (উচ্চতা 26 মি., 30°)',
 q:'একটি মিনারের পাদদেশ থেকে কিছু দূরে একটি স্থানে মিনারটির শীর্ষের উন্নতি 30° এবং মিনারটির উচ্চতা 26 মিটার হলে, মিনার থেকে ঐ স্থানটির দূরত্ব নির্ণয় কর।',
 f:['tan θ = উচ্চতা/দূরত্ব','tan 30° = 1/√3'],
 idea:'উচ্চতা জানা, দূরত্ব অজানা। tan এ দুটোই আছে।',
 dia:()=>D.elev({ang:30,L:{h:'26 মি.',d:'x = ?'}}),
 steps:[['সূত্র','tan 30° = 26/x'],['মান','1/√3 = 26/x'],['সমাধান','x = 26√3 ≈ 45.03']],
 ans:[{l:'দূরত্ব',v:45.03,u:'মিটার'}],fin:'দূরত্ব 26√3 ≈ 45.03 মিটার'},

{id:'c10-p11',sec:'c10x',no:'১০ — ১১',k:'h',gist:'গাছের উচ্চতা (20 মি. দূরে, 60°)',
 q:'একটি গাছের পাদদেশ থেকে 20 মিটার দূরে ভূতলের কোনো বিন্দুতে গাছের চূড়ার উন্নতি কোণ 60° হলে, গাছটির উচ্চতা নির্ণয় কর।',
 f:['tan 60° = √3'],
 idea:'দূরত্ব জানা, উচ্চতা অজানা। tan 60° = h/20।',
 dia:()=>D.elev({ang:60,L:{h:'h = ?',d:'20 মি.'}}),
 steps:[['সূত্র','tan 60° = h/20'],['মান','√3 = h/20'],['সমাধান','h = 20√3 ≈ 34.64']],
 ans:[{l:'উচ্চতা',v:34.64,u:'মিটার'}],fin:'গাছটির উচ্চতা 20√3 ≈ 34.64 মিটার'},

{id:'c10-p12',sec:'c10x',no:'১০ — ১২',k:'h',gist:'18 মিটার মই 45° কোণে দেওয়ালে',
 q:'18 মিটার দৈর্ঘ্য একটি মই ভূমির সাথে 45° কোণ উৎপন্ন করে দেওয়ালের ছাদ স্পর্শ করে। দেওয়ালটির উচ্চতা নির্ণয় কর।',
 f:['sin θ = লম্ব/অতিভুজ','sin 45° = 1/√2'],
 idea:'মই হলো অতিভুজ (18 মি.), দেওয়াল হলো লম্ব। তাই sin।',
 dia:()=>D.elev({ang:45,L:{h:'h = ?',hyp:'মই 18 মি.'}}),
 steps:[['সূত্র','sin 45° = h/18'],['মান','1/√2 = h/18'],['সমাধান','h = 18/√2 = 9√2 ≈ 12.73']],
 ans:[{l:'দেওয়ালের উচ্চতা',v:12.73,u:'মিটার'}],fin:'দেওয়ালের উচ্চতা 9√2 ≈ 12.73 মিটার'},

{id:'c10-p13',sec:'c10x',no:'১০ — ১৩',k:'h',gist:'ছাদ থেকে 20 মিটার দূরের বিন্দুর অবনতি 30°',
 q:'একটি ঘরের ছাদের কোনো বিন্দুতে ঐ বিন্দু থেকে 20 মিটার দূরের ভূতলস্থ একটি বিন্দুর অবনতি কোণ 30° হলে, ঘরটির উচ্চতা নির্ণয় কর।',
 f:['অবনতি কোণ = মাটিতে উন্নতি কোণ','tan 30° = 1/√3'],
 idea:'20 মিটারকে ঘরের গোড়া থেকে অনুভূমিক দূরত্ব ধরা হয়েছে (এটাই প্রচলিত পাঠ)। তাহলে tan।',
 dia:()=>D.elev({ang:30,dep:1,L:{h:'h = ?',d:'20 মি.'}}),
 steps:[['কোণ','মাটিতে উন্নতি কোণ = অবনতি কোণ = 30°'],['সূত্র','tan 30° = h/20 ⟹ 1/√3 = h/20'],['সমাধান','h = 20/√3 = 20√3/3 ≈ 11.55']],
 note:'যদি 20 মিটার ছাদ থেকে তির্যক দূরত্ব (অতিভুজ) হয়, তাহলে h = 20 sin 30° = 10 মিটার। প্রশ্নের চিত্রে যা দেওয়া আছে তার সাথে মিলিয়ে নাও।',
 ans:[{l:'ঘরের উচ্চতা',v:11.55,u:'মিটার'}],fin:'উচ্চতা 20√3/3 ≈ 11.55 মিটার'},

{id:'c10-p14',sec:'c10x',no:'১০ — ১৪',k:'h',gist:'স্তম্ভ: 25 মি. পিছিয়ে 60° থেকে 30°',
 q:'ভূতলে কোনো স্থানে একটি স্তম্ভের শীর্ষের উন্নতি 60°। ঐ স্থান থেকে 25 মিটার পিছিয়ে গেলে স্তম্ভটির উন্নতি কোণ 30° হয়। স্তম্ভটির উচ্চতা নির্ণয় কর।',
 f:['tan 60° = √3,  tan 30° = 1/√3'],
 idea:'উদাহরণ ৫ এর কাঠামো। কাছের দূরত্ব x, দূরের দূরত্ব x + 25।',
 dia:()=>D.elev2({a1:60,a2:30,L:{h:'h',back:'25 মি.',x:'x'}}),
 steps:[['কাছের স্থান (60°)','tan 60° = h/x ⟹ x = h/√3 …(1)'],['দূরের স্থান (30°)','tan 30° = h/(x + 25) ⟹ x + 25 = √3 h …(2)'],['(1) বসাই','h/√3 + 25 = √3 h ⟹ 25 = h(3 − 1)/√3 = 2h/√3'],['সমাধান','h = 25√3/2 ≈ 21.65']],
 chk:'যাচাই: x = 21.65/1.732 = 12.5, x + 25 = 37.5, 21.65/37.5 = 0.577 = tan 30° ✓',
 ans:[{l:'স্তম্ভের উচ্চতা',v:21.65,u:'মিটার'}],fin:'স্তম্ভের উচ্চতা 25√3/2 ≈ 21.65 মিটার'},

{id:'c10-p15',sec:'c10x',no:'১০ — ১৫',k:'h',gist:'60 মিটার এগোলে 45° থেকে 60°',
 q:'কোনো স্থান থেকে একটি মিনারের দিকে 60 মিটার এগিয়ে আসলে মিনারের শীর্ষ বিন্দুর উন্নতি 45° থেকে 60° হয়। মিনারটির উচ্চতা নির্ণয় কর।',
 f:['45° এ দূরত্ব = h (tan 45° = 1)','60° এ দূরত্ব = h/√3'],
 idea:'এগোলে কোণ বাড়ে, তাই 45° দূরের স্থান আর 60° কাছের স্থান। দূরত্বের পার্থক্য 60।',
 dia:()=>D.elev2({a1:60,a2:45,L:{h:'h',back:'60 মি.',x:'h/√3'}}),
 steps:[['দুই দূরত্ব','45° এ দূরত্ব = h, 60° এ দূরত্ব = h/√3'],['পার্থক্য','h − h/√3 = 60 ⟹ h(√3 − 1)/√3 = 60'],['h','h = 60√3/(√3 − 1) = 30(3 + √3) = 90 + 30√3 ≈ 141.96']],
 chk:'যাচাই: প্রথম দূরত্ব 141.96, দ্বিতীয় 141.96/1.732 = 81.96, পার্থক্য 60 ✓',
 ans:[{l:'মিনারের উচ্চতা',v:141.96,u:'মিটার'}],fin:'মিনারের উচ্চতা (90 + 30√3) ≈ 141.96 মিটার'},

{id:'c10-p16',sec:'c10x',no:'১০ — ১৬',k:'h',gist:'নদীর ওপারে টাওয়ার: উচ্চতা ও নদীর বিস্তার',
 q:'একটি নদীর তীর কোনো এক স্থানে দাঁড়িয়ে একজন লোক দেখল যে, ঠিক সোজাসুজি অপর তীরে অবস্থিত একটি টাওয়ারের উন্নতি কোণ 60°। ঐ স্থান থেকে 32 মিটার পিছিয়ে গেলে উন্নতি কোণ 30° হয়। টাওয়ারের উচ্চতা এবং নদীর বিস্তার নির্ণয় কর।',
 f:['নদীর বিস্তার = প্রথম স্থান থেকে টাওয়ারের গোড়ার দূরত্ব'],
 idea:'আগের সমস্যার মতো। নদীর বিস্তার x, পিছিয়ে গেলে দূরত্ব x + 32।',
 dia:()=>D.elev2({a1:60,a2:30,L:{h:'h',back:'32 মি.',x:'নদী x'}}),
 steps:[['60° স্থান','tan 60° = h/x ⟹ x = h/√3 …(1)'],['30° স্থান','tan 30° = h/(x + 32) ⟹ x + 32 = √3 h …(2)'],['সমাধান','h/√3 + 32 = √3 h ⟹ 32 = 2h/√3 ⟹ h = 16√3 ≈ 27.71'],['নদীর বিস্তার','x = h/√3 = 16']],
 chk:'যাচাই: tan 30° = 27.71/(16 + 32) = 27.71/48 = 0.577 ✓',
 ans:[{l:'টাওয়ারের উচ্চতা',v:27.71,u:'মিটার'},{l:'নদীর বিস্তার',v:16,u:'মিটার'}],fin:'উচ্চতা 16√3 ≈ 27.71 মিটার, নদীর বিস্তার 16 মিটার'},

{id:'c10-p17',sec:'c10x',no:'১০ — ১৭',k:'h',gist:'64 মিটার খুঁটি ভেঙে ভূমির সাথে 60° কোণ',
 q:'64 মিটার লম্বা একটি খুঁটি ভেঙে গিয়ে সম্পূর্ণ বিচ্ছিন্ন না হয়ে ভূমির সাথে 60° উৎপন্ন করে। খুঁটিটির ভাঙা অংশের দৈর্ঘ্য নির্ণয় কর।',
 f:['sin 60° = √3/2','দণ্ডায়মান অংশ + ভাঙা অংশ = 64'],
 idea:'এবার কোণ ভূমির সাথে (D তে)। ভাঙা অংশ L হলো অতিভুজ, দণ্ডায়মান অংশ x হলো লম্ব। sin 60° = x/L।',
 dia:()=>D.broken({mode:'ground',ang:60,L:{st:'x',br:'ভাঙা অংশ L',tot:'মোট 64 মি.'}}),
 steps:[['সম্পর্ক','x + L = 64 এবং sin 60° = x/L ⟹ x = (√3/2)L'],['বসাই','(√3/2)L + L = 64 ⟹ L(2 + √3)/2 = 64'],['L','L = 128/(2 + √3) = 128(2 − √3) = 256 − 128√3 ≈ 34.30']],
 chk:'যাচাই: দণ্ডায়মান অংশ 64 − 34.30 = 29.70, 29.70/34.30 = 0.866 = sin 60° ✓',
 ans:[{l:'ভাঙা অংশ',v:34.30,u:'মিটার'}],fin:'ভাঙা অংশ 128(2 − √3) ≈ 34.30 মিটার'},

{id:'c10-p18',sec:'c10x',no:'১০ — ১৮',k:'h',gist:'গাছ ভাঙল: ৩০° কোণ, ১২ মিটার দূরে',
 q:'একটি গাছ ঝড়ে এমনভাবে ভেঙে গেল যে, ভাঙা অংশ দণ্ডায়মান অংশের সাথে 30° কোণ করে গাছের গোড়া থেকে 12 মিটার দূরে মাটি স্পর্শ করে। সম্পূর্ণ গাছটির দৈর্ঘ্য নির্ণয় কর।',
 f:['উদাহরণ ৬ এর হুবহু কাঠামো'],
 idea:'দণ্ডায়মান অংশ x, ভাঙা অংশ L। 30° কোণের বিপরীত বাহু 12।',
 dia:()=>D.broken({mode:'apex',ang:30,L:{base:'12 মি.',st:'x',br:'L',tot:'মোট = x + L'}}),
 steps:[['দণ্ডায়মান অংশ','tan 30° = 12/x ⟹ x = 12√3'],['ভাঙা অংশ','sin 30° = 12/L ⟹ L = 24'],['মোট','12√3 + 24 ≈ 44.78']],
 chk:'যাচাই: x = 20.78, 20.78² + 12² = 432 + 144 = 576 = 24² ✓',
 ans:[{l:'গাছের দৈর্ঘ্য',v:44.78,u:'মিটার'}],fin:'গাছের দৈর্ঘ্য (24 + 12√3) ≈ 44.78 মিটার'},

/* ===================== অধ্যায় ১১ ===================== */
{id:'c11-ex2',sec:'c11e',no:'১১ — উদাহরণ ২',k:'r',gist:'পিতা-পুত্রের বয়সের অনুপাত',
 q:'পিতা ও পুত্রের বর্তমান বয়সের অনুপাত 7 : 2 এবং 5 বছর পরে তাদের বয়সের অনুপাত 8 : 3 হবে। তাদের বর্তমান বয়স কত?',
 f:['অনুপাতের একক u ধরলে পিতা 7u, পুত্র 2u','সময় পরে দুজনের বয়সই সমান বাড়ে'],
 idea:'এক ভাগের মান u ধরি। পিতা 7u, পুত্র 2u। পাঁচ বছর পরে দুজনেরই 5 করে যোগ হয়, ফলে অনুপাত বদলে 8 : 3 হয়।',
 dia:()=>D.hbars({rows:[{l:'পিতা (এখন)',seg:[{w:7,t:'7u',k:'o'}]},{l:'পুত্র (এখন)',seg:[{w:2,t:'2u',k:'g'}]},{l:'পিতা (5 বছর পরে)',seg:[{w:7,t:'7u',k:'o'},{w:2,t:'+5',k:'w'}],end:'অনুপাত 8 : 3'},{l:'পুত্র (5 বছর পরে)',seg:[{w:2,t:'2u',k:'g'},{w:2,t:'+5',k:'w'}]}]}),
 steps:[['অনুপাতের একক','পিতা 7u, পুত্র 2u'],['5 বছর পরে','(7u + 5) : (2u + 5) = 8 : 3 ⟹ 3(7u + 5) = 8(2u + 5)'],['সরল','21u + 15 = 16u + 40 ⟹ 5u = 25 ⟹ u = 5'],['বয়স','পিতা 7 × 5 = 35, পুত্র 2 × 5 = 10']],
 chk:'যাচাই: 5 বছর পরে 40 : 15 = 8 : 3 ✓',
 ans:[{l:'পিতার বয়স',v:35,u:'বছর'},{l:'পুত্রের বয়স',v:10,u:'বছর'}],fin:'পিতা 35 বছর, পুত্র 10 বছর'},

{id:'c11-ex6',sec:'c11e',no:'১১ — উদাহরণ ৬',k:'r',self:1,gist:'যোজন-বিয়োজনে p² − 2p/x + 1 = 0 প্রমাণ',
 q:'(√(1+x) + √(1−x)) / (√(1+x) − √(1−x)) = p হলে, প্রমাণ কর যে, p² − 2p/x + 1 = 0',
 f:['a/b = c/d ⟹ (a+b)/(a−b) = (c+d)/(c−d) (যোজন-বিয়োজন)'],
 idea:'বর্গমূলসহ রাশি ভেঙে হিসাব না করে যোজন-বিয়োজন করি। একবারে বর্গমূল সরে আসে, বর্গ করে আরেকবার যোজন-বিয়োজন করলেই p² + 1 পাওয়া যায়।',
 dia:()=>D.chain({t:['(√(1+x) + √(1−x)) / (√(1+x) − √(1−x)) = p',{s:'√(1+x)/√(1−x) = (p+1)/(p−1)',k:'o'},{s:'(1+x)/(1−x) = (p+1)²/(p−1)²',k:'o'},{s:'1/x = (p² + 1)/2p ⟹ p² − 2p/x + 1 = 0',k:'g'}],ar:['যোজন-বিয়োজন','বর্গ','আবার যোজন-বিয়োজন']}),
 steps:[['প্রথম যোজন-বিয়োজন','2√(1+x) / 2√(1−x) = (p+1)/(p−1) ⟹ √(1+x)/√(1−x) = (p+1)/(p−1)'],['বর্গ','(1+x)/(1−x) = (p+1)²/(p−1)² = (p² + 2p + 1)/(p² − 2p + 1)'],
  ['দ্বিতীয় যোজন-বিয়োজন','(1+x+1−x)/(1+x−1+x) = (2p² + 2)/(4p) ⟹ 2/2x = 2(p²+1)/4p'],['সরল','1/x = (p² + 1)/2p ⟹ p² + 1 = 2p/x ⟹ p² − 2p/x + 1 = 0 (প্রমাণিত)']],
 chk:'সংখ্যায় যাচাই: x = 0.6 হলে √1.6 = 1.2649, √0.4 = 0.6325, p = 1.8974/0.6325 = 3.0 এবং 9 − 2×3/0.6 + 1 = 0 ✓',
 ans:[],fin:'p² − 2p/x + 1 = 0 (প্রমাণিত)'},

{id:'c11-ex15',sec:'c11e',no:'১১ — উদাহরণ ১৫',k:'r',gist:'আয়তাকার জমি ও অপর জমির অনুপাত',
 q:'একটি আয়তাকার জমির ক্ষেত্রফল 12 হেক্টর এবং কর্ণের দৈর্ঘ্য 500 মিটার। ঐ জমির দৈর্ঘ্য ও প্রস্থের সঙ্গে অপর একটি জমির দৈর্ঘ্য ও প্রস্থের অনুপাত যথাক্রমে 3 : 4 এবং 2 : 3। ক) প্রদত্ত আয়তাকার জমিটির ক্ষেত্রফল কত বর্গমিটার? খ) অপর জমিটির ক্ষেত্রফল নির্ণয় কর। গ) প্রদত্ত জমিটির প্রস্থ নির্ণয় কর।',
 f:['1 হেক্টর = 10000 বর্গমি.','(3x + 2y)² − 2(3x)(2y) = (3x)² + (2y)²','(3x − 2y)² = (3x + 2y)² − 4(3x)(2y)'],
 idea:'প্রদত্ত জমি 3x × 2y, অপর জমি 4x × 3y। ক্ষেত্রফল 6xy ও 12xy, তাই অপরটি ঠিক দ্বিগুণ। কর্ণ থেকে (3x + 2y) ও (3x − 2y) বের করে সমাধান।',
 dia:()=>D.rect2({d:'কর্ণ 500'}),
 steps:[['ক)','12 হেক্টর = 12 × 10000 = 120000 বর্গমিটার'],['খ) দুই জমি','প্রদত্ত 3x × 2y = 6xy = 120000 ⟹ xy = 20000<br>অপর 4x × 3y = 12xy = 12 × 20000 = 240000'],
  ['গ) কর্ণ থেকে','9x² + 4y² = 250000 ⟹ (3x + 2y)² − 12xy = 250000<br>(3x + 2y)² = 250000 + 240000 = 490000 ⟹ 3x + 2y = 700'],['গ) অন্তর','(3x − 2y)² = 490000 − 24 × 20000 = 10000 ⟹ 3x − 2y = 100'],['গ) প্রস্থ','বিয়োগ করে 4y = 600 ⟹ y = 150। প্রস্থ = 2y = 300 মিটার, দৈর্ঘ্য 3x = 400 মিটার']],
 note:'বইয়ের শেষ লাইনে y = 150 থেকে "প্রস্থ 150" লেখা মনে হচ্ছে। কিন্তু প্রস্থ ধরা হয়েছিল 2y, তাই প্রস্থ 300 মিটার। যাচাই: 400 × 300 = 120000 এবং √(400² + 300²) = 500 ✓',
 ans:[{l:'ক) ক্ষেত্রফল',v:120000,u:'বর্গমিটার'},{l:'খ) অপর জমির ক্ষেত্রফল',v:240000,u:'বর্গমিটার'},{l:'গ) প্রদত্ত জমির প্রস্থ',v:300,u:'মিটার'}],fin:'ক) 120000 বর্গমি.   খ) 240000 বর্গমি.   গ) 300 মিটার'},

{id:'c11-p15',sec:'c11x',no:'১১.২ — ১৫',k:'r',gist:'সাকিব, মুশফিক, মাশরাফীর 171 রান',
 q:'ক্রিকেট খেলায় সাকিব, মুশফিকুর ও মাশরাফী 171 রান করলো। সাকিব ও মুশফিকুরের এবং মুশফিকুর ও মাশরাফীর রানের অনুপাত 3 : 2 হলে কে কত রান করেছে?',
 f:['দুটি অনুপাতের কমন সদস্য মেলাতে সংখ্যা গুণ করি'],
 idea:'মুশফিকের অংশ দুই অনুপাতে আলাদা (2 ও 3)। দুটিকেই 6 বানালে তিনজনের অনুপাত একসাথে লেখা যায়।',
 dia:()=>D.hbars({rows:[{l:'সাকিব : মুশফিক = 3 : 2 = 9 : 6',seg:[{w:9,t:'সাকিব 9',k:'o'},{w:6,t:'মুশফিক 6',k:'g'}]},{l:'মুশফিক : মাশরাফী = 3 : 2 = 6 : 4',seg:[{w:6,t:'মুশফিক 6',k:'g'},{w:4,t:'মাশরাফী 4',k:''}]},{l:'তিনজন মিলে = 171 রান',seg:[{w:9,t:'9',k:'o'},{w:6,t:'6',k:'g'},{w:4,t:'4',k:''}],end:'মোট 19 ভাগ'}]}),
 steps:[['অনুপাত মেলাই','সাকিব : মুশফিক = 3 : 2 = 9 : 6 (3 দিয়ে গুণ)<br>মুশফিক : মাশরাফী = 3 : 2 = 6 : 4 (2 দিয়ে গুণ)<br>সাকিব : মুশফিক : মাশরাফী = 9 : 6 : 4'],['ভাগ','মোট 9 + 6 + 4 = 19 ভাগ। এক ভাগ = 171 ÷ 19 = 9'],['রান','সাকিব 9 × 9 = 81, মুশফিক 6 × 9 = 54, মাশরাফী 4 × 9 = 36']],
 chk:'যাচাই: 81 + 54 + 36 = 171 ✓',
 ans:[{l:'সাকিব',v:81,u:'রান'},{l:'মুশফিক',v:54,u:'রান'},{l:'মাশরাফী',v:36,u:'রান'}],fin:'সাকিব 81, মুশফিক 54, মাশরাফী 36 রান'},

{id:'c11-p16',sec:'c11x',no:'১১.২ — ১৬',k:'r',gist:'অফিসের কর্মকর্তা, সহকারী, সহায়কের বেতন',
 q:'একটি অফিসে 2 জন কর্মকর্তা, 7 জন অফিস সহকারী এবং 3 জন অফিস সহায়ক আছে। একজন অফিস সহায়ক 1 টাকা পেলে একজন অফিস সহকারী পায় 2 টাকা, একজন কর্মকর্তা পায় 4 টাকা। তাদের সকলের মোট বেতন 150,000 টাকা হলে, কে কত বেতন পায়?',
 f:['মোট ভাগ = (জন × জনপ্রতি ভাগ) এর যোগফল'],
 idea:'এক সহায়কের বেতন 1 ভাগ ধরি। তাহলে সহকারী 2 ভাগ, কর্মকর্তা 4 ভাগ। জন দিয়ে গুণ করে মোট ভাগ।',
 dia:()=>D.hbars({rows:[{l:'মোট 25 ভাগ = 150000 টাকা',seg:[{w:8,t:'কর্মকর্তা 2×4 = 8',k:'o'},{w:14,t:'সহকারী 7×2 = 14',k:'g'},{w:3,t:'3',k:''}]}],n:'কমলা = কর্মকর্তা, সবুজ = সহকারী, নীল = সহায়ক (3×1 = 3 ভাগ)'}),
 steps:[['ভাগ গুনি','কর্মকর্তা 2 × 4 = 8, সহকারী 7 × 2 = 14, সহায়ক 3 × 1 = 3'],['মোট ভাগ','8 + 14 + 3 = 25 ভাগ ⟹ 1 ভাগ = 150000 ÷ 25 = 6000 টাকা'],['প্রত্যেকের বেতন','সহায়ক 6000, সহকারী 12000, কর্মকর্তা 24000 টাকা']],
 chk:'যাচাই: 2×24000 + 7×12000 + 3×6000 = 48000 + 84000 + 18000 = 150000 ✓',
 ans:[{l:'সহায়ক',v:6000,u:'টাকা'},{l:'সহকারী',v:12000,u:'টাকা'},{l:'কর্মকর্তা',v:24000,u:'টাকা'}],fin:'সহায়ক 6000, সহকারী 12000, কর্মকর্তা 24000 টাকা'},

{id:'c11-p20',sec:'c11x',no:'১১.২ — ২০',k:'r',gist:'ধান-চাল ও গম-সুজির অনুপাত',
 q:'ধান ও ধান থেকে উৎপন্ন চালের অনুপাত 3 : 2 এবং গম ও গম থেকে উৎপন্ন সুজির অনুপাত 4 : 3 হলে, সমান পরিমাণের ধান ও গম থেকে উৎপন্ন চাল ও সুজির অনুপাত বের কর।',
 f:['সমান পরিমাণ ধরতে 3 ও 4 এর ল.সা.গু. = 12 নিই'],
 idea:'সমান পরিমাণ ধান ও গম নিতে হবে। 3 ও 4 দুটিতে ভাগ যায় এমন সংখ্যা 12 কেজি নিলে সব পূর্ণসংখ্যা হয়।',
 dia:()=>D.hbars({rows:[{l:'ধান 12 কেজি (ধান : চাল = 3 : 2)',seg:[{w:8,t:'চাল 8 কেজি',k:'o'},{w:4,t:'বাকি',k:'w'}]},{l:'গম 12 কেজি (গম : সুজি = 4 : 3)',seg:[{w:9,t:'সুজি 9 কেজি',k:'g'},{w:3,t:'বাকি',k:'w'}]}]}),
 steps:[['সমান পরিমাণ','12 কেজি ধান ও 12 কেজি গম নিই'],['চাল','12 × 2/3 = 8 কেজি'],['সুজি','12 × 3/4 = 9 কেজি'],['অনুপাত','চাল : সুজি = 8 : 9']],
 ans:[{l:'চাল (অনুপাতের প্রথম সংখ্যা)',v:8,u:''},{l:'সুজি (দ্বিতীয় সংখ্যা)',v:9,u:''}],fin:'চাল : সুজি = 8 : 9'},

{id:'c11-p22',sec:'c11x',no:'১১.২ — ২২',k:'r',gist:'জেমি ও সিমির ঋণের অনুপাত',
 q:'জেমি ও সিমি একই ব্যাংক থেকে একই দিনে 10% সরল মুনাফায় আলাদা আলাদা পরিমাণ অর্থ ঋণ নেয়। জেমি 2 বছর পর মুনাফা-আসলে যত টাকা শোধ করে তত টাকা সিমি 3 বছর পর মুনাফা-আসলে শোধ করে। তাদের ঋণের অনুপাত নির্ণয় কর।',
 f:['সরল মুনাফায় আসল + মুনাফা = P(1 + r·n)'],
 idea:'জেমি 2 বছরে P₁ × 1.2, সিমি 3 বছরে P₂ × 1.3। দুটি শোধ সমান। সমীকরণ থেকে P₁ : P₂।',
 dia:()=>D.hbars({rows:[{l:'জেমি: 2 বছরে 20% মুনাফা',seg:[{w:1300,t:'P₁',k:'o'},{w:260,t:'20%',k:'w'}],end:'শোধ = 1.2P₁'},{l:'সিমি: 3 বছরে 30% মুনাফা',seg:[{w:1200,t:'P₂',k:'g'},{w:360,t:'30%',k:'w'}],end:'শোধ = 1.3P₂'}],n:'দুই শোধের পরিমাণ সমান'}),
 steps:[['জেমির শোধ','P₁(1 + 0.1 × 2) = 1.2P₁ = 6P₁/5'],['সিমির শোধ','P₂(1 + 0.1 × 3) = 1.3P₂ = 13P₂/10'],['সমান করি','6P₁/5 = 13P₂/10 ⟹ 12P₁ = 13P₂'],['অনুপাত','P₁/P₂ = 13/12']],
 chk:'যাচাই: P₁ = 1300, P₂ = 1200 ⟹ 1300 × 1.2 = 1560 = 1200 × 1.3 ✓',
 ans:[{l:'জেমির ঋণ (অনুপাতের প্রথম সংখ্যা)',v:13,u:''},{l:'সিমির ঋণ (দ্বিতীয় সংখ্যা)',v:12,u:''}],fin:'জেমির ঋণ : সিমির ঋণ = 13 : 12'},

/* ===================== অধ্যায় ১২ ===================== */
{id:'c12-ex13',sec:'c12e',no:'১২ — উদাহরণ ১৩',k:'d',gist:'৮ বছর আগে পিতা পুত্রের ৮ গুণ',
 q:'আট বছর পূর্বে পিতার বয়স পুত্রের বয়সের আটগুণ ছিল। দশ বছর পর পিতার বয়স পুত্রের বয়সের দ্বিগুণ হবে। বর্তমানে কার বয়স কত?',
 f:['এখনকার বয়স x, y ধরলে ৮ বছর আগে x − 8, y − 8'],
 idea:'দুটি শর্ত থেকে দুটি সমীকরণ। একটিকে x এর জন্য সাজিয়ে অপরটিতে বসাই (প্রতিস্থাপন)।',
 dia:()=>D.chain({t:['পিতা x, পুত্র y (বর্তমান)',{s:'৮ বছর আগে: x − 8 = 8(y − 8) ⟹ x = 8y − 56',k:'o'},{s:'১০ বছর পরে: x + 10 = 2(y + 10)',k:'o'},{s:'8y − 56 + 10 = 2y + 20 ⟹ y = 11,  x = 32',k:'g'}],ar:['১ম শর্ত','২য় শর্ত','x বসিয়ে']}),
 steps:[['সমীকরণ','x − 8 = 8(y − 8) …(1)<br>x + 10 = 2(y + 10) …(2)'],['(1) থেকে','x = 8y − 56 …(3)'],['(2) এ বসাই','8y − 56 + 10 = 2y + 20 ⟹ 6y = 66 ⟹ y = 11'],['x','x = 8 × 11 − 56 = 32']],
 chk:'যাচাই: ৮ বছর আগে 24 = 8 × 3 ✓। ১০ বছর পরে 42 = 2 × 21 ✓',
 ans:[{l:'পিতার বয়স',v:32,u:'বছর'},{l:'পুত্রের বয়স',v:11,u:'বছর'}],fin:'পিতা 32 বছর, পুত্র 11 বছর'},

{id:'c12-ex14',sec:'c12e',no:'১২ — উদাহরণ ১৪',k:'d',gist:'বাগান ও চারপাশের ইটের রাস্তার খরচ',
 q:'একটি আয়তাকার বাগানের প্রস্থের দ্বিগুণ, দৈর্ঘ্য অপেক্ষা 10 মিটার বেশি এবং বাগানটির পরিসীমা 100 মিটার। বাগানটির সীমানার বাইরে চারদিকে 2 মিটার চওড়া রাস্তা আছে। রাস্তাটি ইট দিয়ে তৈরি করতে প্রতি বর্গ মিটারে 110 টাকা খরচ হয়। ক) বাগানটির দৈর্ঘ্য x মিটার ও প্রস্থ y মিটার ধরে সমীকরণজোট গঠন কর। খ) বাগানটির দৈর্ঘ্য ও প্রস্থ নির্ণয় কর। গ) রাস্তাটি ইট দিয়ে তৈরি করতে মোট কত খরচ হবে?',
 f:['রাস্তার ক্ষেত্রফল = রাস্তাসহ ক্ষেত্রফল − বাগানের ক্ষেত্রফল','বাইরে রাস্তা হলে প্রতি মাপে 2 × 2 = 4 মিটার যোগ'],
 idea:'(ক) ও (খ) তে দুটি সমীকরণ থেকে x, y। (গ) তে রাস্তা বাইরে বলে দুই দিকে যোগ হয়। নিজে করার ঘরে খ ও গ এর মান দাও।',
 dia:()=>D.rect_in_rect({edge:'রাস্তা 2 মি.',inner:'বাগান x × y',area:'পরিসীমা 100 মি.',outer:'রাস্তাসহ (x + 4) × (y + 4)'}),
 steps:[['ক) সমীকরণজোট','2y = x + 10 …(1)<br>2(x + y) = 100 …(2)'],['খ) সমাধান','(2) থেকে 2x + 2y = 100। (1) থেকে 2y বসিয়ে 2x + x + 10 = 100 ⟹ x = 30<br>(1) থেকে 2y = 40 ⟹ y = 20'],['গ) রাস্তাসহ মাপ','দৈর্ঘ্য 30 + 4 = 34, প্রস্থ 20 + 4 = 24'],['গ) রাস্তার ক্ষেত্রফল','34 × 24 − 30 × 20 = 816 − 600 = 216 বর্গমি.'],['গ) খরচ','216 × 110 = 23760 টাকা']],
 ans:[{l:'খ) দৈর্ঘ্য',v:30,u:'মিটার'},{l:'খ) প্রস্থ',v:20,u:'মিটার'},{l:'গ) মোট খরচ',v:23760,u:'টাকা'}],fin:'দৈর্ঘ্য 30 মি., প্রস্থ 20 মি., খরচ 23760 টাকা'},

{id:'c12-p14',sec:'c12x',no:'১২.৪ — ১৪',k:'d',gist:'মাতা ও দুই কন্যার বয়স',
 q:'মাতার বর্তমান বয়স তার দুই কন্যার বয়সের সমষ্টির চারগুণ। 5 বছর পর মাতার বয়স ঐ দুই কন্যার বয়সের সমষ্টির দ্বিগুণ হবে। মাতার বর্তমান বয়স কত?',
 f:['5 বছরে দুই কন্যার বয়সের সমষ্টি বাড়ে 5 + 5 = 10'],
 idea:'এখানে সূক্ষ্ম জায়গা: কন্যা দুজন, তাই সমষ্টি বাড়ে 10। কন্যাদের সমষ্টি S ধরলে মাতা 4S।',
 dia:()=>D.hbars({rows:[{l:'এখন: মাতা = 4 × কন্যাদের সমষ্টি',seg:[{w:4,t:'মাতা 4S',k:'o'}]},{l:'এখন: কন্যাদের সমষ্টি',seg:[{w:1,t:'S',k:'g'}]},{l:'5 বছর পরে: মাতা',seg:[{w:4,t:'4S',k:'o'},{w:.8,t:'+5',k:'w'}],end:'= 2 × (কন্যা)'},{l:'5 বছর পরে: কন্যাদের সমষ্টি',seg:[{w:1,t:'S',k:'g'},{w:1.6,t:'+10',k:'w'}]}]}),
 steps:[['সম্পর্ক','মাতার বয়স = 4S। 5 বছর পরে মাতা 4S + 5, কন্যাদের সমষ্টি S + 10'],['সমীকরণ','4S + 5 = 2(S + 10) = 2S + 20'],['S','2S = 15 ⟹ S = 7.5'],['মাতার বয়স','4 × 7.5 = 30']],
 chk:'যাচাই: 5 বছর পরে মাতা 35, কন্যাদের সমষ্টি 17.5, 2 × 17.5 = 35 ✓',
 ans:[{l:'মাতার বয়স',v:30,u:'বছর'}],fin:'মাতার বয়স 30 বছর'},

{id:'c12-p15',sec:'c12x',no:'১২.৪ — ১৫',k:'d',gist:'আয়তক্ষেত্রের দুই শর্তে দৈর্ঘ্য ও প্রস্থ',
 q:'একটি আয়তক্ষেত্রের দৈর্ঘ্য 5 মিটার কম ও প্রস্থ 3 মিটার বেশি হলে ক্ষেত্রফল 9 বর্গমিটার কম হবে। আবার দৈর্ঘ্য 3 মিটার বেশি ও প্রস্থ 2 মিটার বেশি হলে ক্ষেত্রফল 67 বর্গমিটার বেশি হবে। ক্ষেত্রটির দৈর্ঘ্য ও প্রস্থ নির্ণয় কর।',
 f:['(x − 5)(y + 3) = xy − 9','(x + 3)(y + 2) = xy + 67','xy কেটে গিয়ে সরল সমীকরণ হয়'],
 idea:'দুই শর্তেই বিস্তার করলে xy দুই পাশে কাটা পড়ে, তাই দ্বিঘাত নয়, দুটি সরল সমীকরণ থেকে নির্মূলন পদ্ধতি।',
 dia:()=>D.area_swap({W:'দৈর্ঘ্য x',H:'প্রস্থ y',rm:'দৈর্ঘ্য −5',ad:'প্রস্থ +3',cap:'১ম শর্তে ক্ষেত্রফল 9 কমে'}),
 steps:[['১ম শর্ত','xy + 3x − 5y − 15 = xy − 9 ⟹ 3x − 5y = 6 …(1)'],['২য় শর্ত','xy + 2x + 3y + 6 = xy + 67 ⟹ 2x + 3y = 61 …(2)'],['y নির্মূল','(1) × 3: 9x − 15y = 18<br>(2) × 5: 10x + 15y = 305<br>যোগ করে 19x = 323 ⟹ x = 17'],['y','(1) এ 51 − 5y = 6 ⟹ y = 9']],
 chk:'যাচাই: (12)(12) = 144 = 153 − 9 ✓। (20)(11) = 220 = 153 + 67 ✓',
 ans:[{l:'দৈর্ঘ্য',v:17,u:'মিটার'},{l:'প্রস্থ',v:9,u:'মিটার'}],fin:'দৈর্ঘ্য 17 মিটার, প্রস্থ 9 মিটার'},

{id:'c12-p16',sec:'c12x',no:'১২.৪ — ১৬',k:'d',gist:'দাঁড় বেয়ে স্রোতের অনুকূলে 15, প্রতিকূলে 5',
 q:'একটি নৌকা দাঁড় বেয়ে স্রোতের অনুকূলে ঘণ্টায় 15 কি.মি. যায় এবং স্রোতের প্রতিকূলে যায় ঘণ্টায় 5 কি.মি.। নৌকার বেগ নির্ণয় কর।',
 f:['অনুকূলে x + y,  প্রতিকূলে x − y'],
 idea:'নৌকার বেগ x, স্রোতের বেগ y। যোগ করলে y কাটা যায়।',
 dia:()=>D.river({l1:'অনুকূলে x + y = 15',l2:'প্রতিকূলে x − y = 5',n:'x = নৌকার বেগ, y = স্রোতের বেগ'}),
 steps:[['সমীকরণ','x + y = 15,  x − y = 5'],['যোগ','2x = 20 ⟹ x = 10'],['স্রোত','y = 15 − 10 = 5']],
 ans:[{l:'নৌকার বেগ',v:10,u:'কি.মি./ঘ.'},{l:'স্রোতের বেগ',v:5,u:'কি.মি./ঘ.'}],fin:'নৌকার বেগ 10 কি.মি./ঘণ্টা (স্রোতের বেগ 5)'},

{id:'c12-p17',sec:'c12x',no:'১২.৪ — ১৭',k:'d',gist:'গার্মেন্টস শ্রমিকের শুরুর বেতন ও বার্ষিক বৃদ্ধি',
 q:'একজন গার্মেন্টস শ্রমিক মাসিক বেতনে চাকরি করেন। প্রতিবছর শেষে একটি নির্দিষ্ট বেতনবৃদ্ধি পান। তার মাসিক বেতন 4 বছর পর 4500 টাকা ও 8 বছর পর 5000 টাকা হয়। তার চাকরি শুরুর বেতন ও বার্ষিক বেতন বৃদ্ধির পরিমাণ নির্ণয় কর।',
 f:['n বছর পরে বেতন = শুরুর বেতন + n × বৃদ্ধি'],
 idea:'শুরুর বেতন s, বার্ষিক বৃদ্ধি d। বেতন সরলরেখায় বাড়ে। দুটি বিন্দু দিয়ে রেখাটি আঁকলে ঢাল d আর y-অক্ষের মান s।',
 dia:()=>D.linegraph({}),
 steps:[['সমীকরণ','s + 4d = 4500,  s + 8d = 5000'],['বিয়োগ','4d = 500 ⟹ d = 125'],['শুরুর বেতন','s = 4500 − 4 × 125 = 4000']],
 chk:'যাচাই: 4000 + 8 × 125 = 5000 ✓',
 ans:[{l:'শুরুর বেতন',v:4000,u:'টাকা'},{l:'বার্ষিক বৃদ্ধি',v:125,u:'টাকা'}],fin:'শুরুর বেতন 4000 টাকা, বার্ষিক বৃদ্ধি 125 টাকা'},

{id:'c12-p20',sec:'c12x',no:'১২.৪ — ২০',k:'d',gist:'দুই বহুভুজের বাহু 17, কর্ণ 53',
 q:'দুইটি বহুভুজের বাহুর সংখ্যা 17 এবং এদের কর্ণের সংখ্যা 53 হলে প্রত্যেক বহুভুজের বাহুর সংখ্যা কত?',
 f:['n বাহুর বহুভুজের কর্ণ = n(n − 3)/2','(x + y)² = x² + y² + 2xy'],
 idea:'বাহু x ও y ধরি। কর্ণের সূত্র থেকে x² + y² বের করি, তারপর xy। যোগফল ও গুণফল জানলে সংখ্যা দুটি সহজেই মেলে।',
 dia:()=>D.polygons({n1:6,n2:11}),
 steps:[['সমীকরণ','x + y = 17 এবং x(x−3)/2 + y(y−3)/2 = 53'],['সরল','x² + y² − 3(x + y) = 106 ⟹ x² + y² = 106 + 51 = 157'],['xy','289 = 157 + 2xy ⟹ xy = 66'],['x, y','যোগফল 17, গুণফল 66 ⟹ সংখ্যা দুটি 6 ও 11']],
 chk:'যাচাই: ষড়ভুজের কর্ণ 6×3/2 = 9, একাদশভুজের 11×8/2 = 44, 9 + 44 = 53 ✓',
 ans:[{l:'ছোট বহুভুজের বাহু',v:6,u:'টি'},{l:'বড় বহুভুজের বাহু',v:11,u:'টি'}],fin:'6 বাহু ও 11 বাহু'},

{id:'c12-p21',sec:'c12x',no:'১২.৪ — ২১',k:'d',gist:'একা না জুটিতে: কত ভাগ একা কাজ করল',
 q:'শিক্ষক বললেন একটি কাজ একা অথবা ছাত্র-ছাত্রীর জুটি করতে পারবে। ছাত্রদের 2/3 এবং ছাত্রীদের 3/5 অংশ জুটি বেঁধে কাজটি করলো। শ্রেণির কত ভাগ ছাত্র-ছাত্রী একা কাজটি করলো?',
 f:['প্রতি জুটিতে 1 ছাত্র + 1 ছাত্রী, তাই জুটির ছাত্র সংখ্যা = জুটির ছাত্রী সংখ্যা'],
 idea:'ছাত্র b, ছাত্রী g। জুটিতে ছাত্র (2/3)b আর ছাত্রী (3/5)g, দুটি সমান। এ থেকে b : g = 9 : 10। এরপর ভাগে ভাগে গুনে একা কতজন বের করি। উত্তর ভগ্নাংশে লিখতে পারো, যেমন 3/7।',
 dia:()=>D.hbars({rows:[{l:'ছাত্র (9k জন)',seg:[{w:6,t:'জুটিতে 6k',k:'o'},{w:3,t:'একা 3k',k:'g'}]},{l:'ছাত্রী (10k জন)',seg:[{w:6,t:'জুটিতে 6k',k:'o'},{w:4,t:'একা 4k',k:'g'}]}],n:'জুটিতে দুই দলের সংখ্যা সমান (6k = 6k)'}),
 steps:[['সমান সংখ্যা','(2/3)b = (3/5)g ⟹ b/g = 9/10'],['k দিয়ে লিখি','b = 9k, g = 10k, মোট 19k'],['জুটিতে','ছাত্র (2/3)(9k) = 6k, ছাত্রী (3/5)(10k) = 6k, মোট 12k'],['একা','19k − 12k = 7k ⟹ ভগ্নাংশ 7k/19k = 7/19']],
 ans:[{l:'একা কাজ করল (ভগ্নাংশ বা দশমিক)',v:7/19,u:'',t:.002}],fin:'শ্রেণির 7/19 ভাগ একা কাজ করল'}
);

const pick=a=>a[Math.floor(Math.random()*a.length)];
const f=(x,d=2)=>(+(+x).toFixed(d)).toString();
const T3=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15],[12,16,20],[7,24,25],[10,24,26]];
const RT=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[9,40,41],[9,12,15],[12,16,20],[15,20,25],[27,36,45],[6,8,10]];
const TS=[[12,[5,9,16,35]],[15,[8,20,36]],[24,[7,10,18,32]]];
const GEN=[
{id:'tri-eq',t:'সমবাহু ত্রিভুজ',s:'বাহু বাড়ালে ক্ষেত্রফল বাড়ে',k:'t',make(){
 const a=ri(3,12),k=pick([2,4]),m=k===2?a+1:2*(a+2);
 return{q:`একটি সমবাহু ত্রিভুজের প্রত্যেক বাহুর দৈর্ঘ্য ${k} মিটার বাড়ালে ক্ষেত্রফল ${m}√3 বর্গমিটার বেড়ে যায়। ত্রিভুজটির বাহুর দৈর্ঘ্য কত?`,
 dia:D.tri_eq({k,n2:`= ${m}√3 বর্গমি.`}),hint:`দুই ক্ষেত্রফলের বিয়োগফলে ${fr('√3','4')} কমন নিয়ে কেটে দাও।`,
 steps:[['সমীকরণ',`${fr('√3','4')}[(a+${k})² − a²] = ${m}√3`],['ভাগ করি',`(a+${k})² − a² = ${4*m}`],['সরল',`${2*k}a + ${k*k} = ${4*m}<br>⟹ a = ${a}`]],
 ans:[{l:'বাহু',v:a,u:'মিটার'}],fin:`বাহু ${a} মিটার`};}},

{id:'iso',t:'সমদ্বিবাহু ত্রিভুজ',s:'ভূমি ও ক্ষেত্রফল থেকে সমান বাহু',k:'t',make(){
 const[p,h,c]=pick(T3),b=2*p,A=p*h;
 return{q:`একটি সমদ্বিবাহু ত্রিভুজের ভূমি ${b} সে.মি. এবং ক্ষেত্রফল ${A} বর্গ সে.মি.। সমান সমান বাহুর দৈর্ঘ্য নির্ণয় কর।`,
 dia:D.tri_iso({b:`${b} সে.মি.`,a:'?',h:'h',area:`${A} বর্গ সে.মি.`}),hint:'ক্ষেত্রফল থেকে উচ্চতা, তারপর ভূমির অর্ধেক ও উচ্চতা নিয়ে পিথাগোরাস।',
 steps:[['উচ্চতা',`½ × ${b} × h = ${A} ⟹ h = ${h}`],['পিথাগোরাস',`a² = ${p}² + ${h}² = ${p*p+h*h}<br>⟹ a = ${c}`]],
 ans:[{l:'সমান বাহু',v:c,u:'সে.মি.'}],fin:`সমান বাহু ${c} সে.মি.`};}},

{id:'roads',t:'দুই রাস্তা ও সরাসরি দূরত্ব',s:'লম্ব টেনে পিথাগোরাস',k:'t',make(){
 const th=pick([120,135,150]),v1=ri(6,12),v2=ri(4,v1),t=ri(2,6),ab=v1*t,ac=v2*t,al=(180-th)*Math.PI/180,
 cd=ac*Math.sin(al),ad=ac*Math.cos(al),bc2=(ab+ad)**2+cd**2,bc=Math.sqrt(bc2);
 return{q:`একটি নির্দিষ্ট স্থান থেকে দুইটি রাস্তা ${th}° কোণে দুই দিকে চলে গেছে। দুই জন লোক ঐ স্থান থেকে ঘণ্টায় যথাক্রমে ${v1} কি.মি. ও ${v2} কি.মি. বেগে রওনা হলো। ${t} ঘণ্টা পর তাদের সরাসরি দূরত্ব কত? (দুই দশমিক ঘর)`,
 dia:D.roads({ab,ac,th,L:{ab:`AB = ${ab}`,ac:`AC = ${ac}`}}),hint:`C থেকে বর্ধিত BA এর উপর লম্ব টানলে কোণ হবে 180° − ${th}° = ${180-th}°।`,
 steps:[['দূরত্ব',`AB = ${t} × ${v1} = ${ab}, AC = ${t} × ${v2} = ${ac} কি.মি.`],['লম্ব',`∠DAC = 180° − ${th}° = ${180-th}°`],
  ['CD ও AD',`CD = AC sin ${180-th}° ≈ ${f(cd)}<br>AD = AC cos ${180-th}° ≈ ${f(ad)}`],['পিথাগোরাস',`BC² = (AB + AD)² + CD² ≈ ${f(bc2)}`],['উত্তর',`BC ≈ ${f(bc)} কি.মি.`]],
 ans:[{l:'সরাসরি দূরত্ব',v:+bc.toFixed(2),u:'কি.মি.'}],fin:`দূরত্ব ≈ ${f(bc)} কি.মি.`};}},

{id:'rect-cut',t:'আয়তক্ষেত্র থেকে বর্গ',s:'দৈর্ঘ্য কমালে বর্গ হয়',k:'q',make(){
 const w=ri(6,30),d=ri(3,12),l=w+d,A=w*l;
 return{q:`একটি আয়তক্ষেত্রের ক্ষেত্রফল ${A} বর্গমিটার। এর দৈর্ঘ্য ${d} মিটার কম হলে এটি একটি বর্গক্ষেত্র হতো। আয়তক্ষেত্রটির দৈর্ঘ্য ও প্রস্থ নির্ণয় কর।`,
 dia:D.rect_cut({l:'দৈর্ঘ্য',w:'y',d:`${d} মি.`}),hint:`প্রস্থ y ধরলে দৈর্ঘ্য y + ${d}। ঋণাত্মক মান বাদ দিতে ভুলো না।`,
 steps:[['সম্পর্ক',`প্রস্থ y হলে দৈর্ঘ্য y + ${d}`],['সমীকরণ',`y(y + ${d}) = ${A}<br>⟹ y² + ${d}y − ${A} = 0`],['উৎপাদক',`(y − ${w})(y + ${l}) = 0<br>⟹ y = ${w} (ঋণাত্মক মান বাদ)`],['দৈর্ঘ্য',`${w} + ${d} = ${l}`]],
 ans:[{l:'দৈর্ঘ্য',v:l,u:'মিটার'},{l:'প্রস্থ',v:w,u:'মিটার'}],fin:`দৈর্ঘ্য ${l} মি., প্রস্থ ${w} মি.`};}},

{id:'road-sq',t:'বর্গাকার মাঠ ও রাস্তা',s:'বাইরে বা ভিতরে রাস্তা',k:'q',make(){
 const x=ri(14,40),r=ri(2,6),out=Math.random()<.5;
 if(out){const A=4*r*x+4*r*r;
  return{q:`একটি বর্গাকার মাঠের বাইরে চারদিকে ${r} মিটার চওড়া একটি রাস্তা আছে। রাস্তার ক্ষেত্রফল ${A} বর্গমিটার হলে মাঠের ক্ষেত্রফল নির্ণয় কর।`,
  dia:D.field_road({w:`${r} মি.`,inner:'মাঠ x',outer:`রাস্তাসহ বাহু = x + ${2*r}`}),hint:'বড় বর্গ − মাঠের বর্গ = রাস্তা।',
  steps:[['বাহু',`মাঠের বাহু x, রাস্তাসহ x + ${2*r}`],['সমীকরণ',`(x + ${2*r})² − x² = ${A}<br>⟹ ${4*r}x + ${4*r*r} = ${A}`],['x',`x = ${x}`],['ক্ষেত্রফল',`${x}² = ${x*x}`]],
  ans:[{l:'মাঠের ক্ষেত্রফল',v:x*x,u:'বর্গমিটার'}],fin:`মাঠের ক্ষেত্রফল ${x*x} বর্গমিটার`};}
 const A=4*r*x-4*r*r;
 return{q:`একটি বর্গাকার মাঠের ভিতরে চারদিকে ${r} মিটার চওড়া একটি রাস্তা আছে। রাস্তার ক্ষেত্রফল ${A} বর্গমিটার হলে রাস্তা বাদে মাঠের ক্ষেত্রফল নির্ণয় কর।`,
 dia:D.field_road({w:`${r} মি.`,inner:`বাহু (x − ${2*r})`,outer:'পুরো মাঠের বাহু = x'}),hint:`রাস্তা ভিতরে, তাই ভিতরের বাহু x − ${2*r}।`,
 steps:[['ভিতরের বাহু',`মাঠের বাহু x, রাস্তা বাদে x − ${2*r}`],['সমীকরণ',`x² − (x − ${2*r})² = ${A}<br>⟹ ${4*r}x − ${4*r*r} = ${A}`],['x',`x = ${x}`],['রাস্তা বাদে ক্ষেত্রফল',`(${x} − ${2*r})² = ${(x-2*r)**2}`]],
 ans:[{l:'রাস্তা বাদে ক্ষেত্রফল',v:(x-2*r)**2,u:'বর্গমিটার'}],fin:`ক্ষেত্রফল ${(x-2*r)**2} বর্গমিটার`};}},

{id:'trap',t:'ট্রাপিজিয়ামের ক্ষেত্রফল',s:'চার বাহু দেওয়া, উচ্চতা অজানা',k:'q',make(){
 const[h,xs]=pick(TS),x=pick(xs),y=pick(xs),sh=ri(8,30),D2=x+y,lg=sh+D2,c1=Math.round(Math.hypot(h,x)),c2=Math.round(Math.hypot(h,y)),A=(lg+sh)*h/2;
 return{q:`একটি ট্রাপিজিয়ামের সমান্তরাল বাহুদ্বয়ের দৈর্ঘ্য ${lg} সে.মি. ও ${sh} সে.মি. এবং অপর বাহু দুইটির দৈর্ঘ্য ${c1} সে.মি. ও ${c2} সে.মি.। ক্ষেত্রফল নির্ণয় কর।`,
 dia:D.trapezoid({u:[14,100,70],L:{ab:`AB = ${lg}`,cd:`CD = ${sh}`,ad:`${c1}`,bc:`${c2}`,h:'h',ae:'x',ef:`${sh}`,fb:`${D2} − x`}}),
 hint:'দুই মাথা থেকে লম্ব নামাও। দুটি সমকোণী ত্রিভুজে পিথাগোরাস লিখে বিয়োগ করলে x পাবে।',
 steps:[['লম্ব টানি',`AE = x, EF = ${sh}, BF = ${D2} − x`],['দুই সমকোণী ত্রিভুজ',`x² + h² = ${c1}² …(1)<br>(${D2} − x)² + h² = ${c2}² …(2)`],
  ['(2) − (1)',`${D2*D2} − ${2*D2}x = ${c2*c2} − ${c1*c1}<br>⟹ x = ${x}`],['উচ্চতা',`h² = ${c1}² − ${x}² = ${h*h} ⟹ h = ${h}`],['ক্ষেত্রফল',`½(${lg} + ${sh}) × ${h} = ${f(A)}`]],
 ans:[{l:'ক্ষেত্রফল',v:A,u:'বর্গ সে.মি.'}],fin:`ক্ষেত্রফল ${f(A)} বর্গ সে.মি.`};}},

{id:'rhombus',t:'রম্বস',s:'পরিসীমা ও এক কর্ণ থেকে অপর কর্ণ',k:'q',make(){

 const C=+vals[n].toFixed(2),I=+(C-P).toFixed(2);
 return{q:`বার্ষিক ${r}% চক্রবৃদ্ধি মুনাফায় ${P} টাকার ${n} বছরের সবৃদ্ধিমূল ও চক্রবৃদ্ধি মুনাফা নির্ণয় কর। (দুই দশমিক ঘর)`,
 dia:D.bars({v:vals.map((v,i)=>({v:v,t:f(v),l:i?i+' বছর':'শুরু',k:i===n?'g':i?'o':''})),n:`প্রতি বছর × ${f(1+r/100,2)}`}),hint:`C = P(1 + r)ⁿ, যেখানে r = ${r}/100`,
 steps:[['সূত্র',`C = ${P}(1 + ${r}/100)^${n}`],['হিসাব',`= ${P} × ${f(1+r/100,2)}^${n} = ${f(C)}`],['মুনাফা',`${f(C)} − ${P} = ${f(I)}`]],ans:[{l:'সবৃদ্ধিমূল',v:C,u:'টাকা'},{l:'চক্রবৃদ্ধি মুনাফা',v:I,u:'টাকা'}],fin:`সবৃদ্ধিমূল ${f(C)} টাকা, মুনাফা ${f(I)} টাকা`};}},

{id:'a-share',ch:'c3',t:'চাঁদার সমস্যা',s:'কয়েকজন না দিলে জনপ্রতি বাড়ে',k:'a',make(){
 const k=pick([4,5,6]),m=pick([1,2,3]),d=k*m,x=ri(15,50),q=m*(x-k),T=x*q;
 return{q:`একটি সমিতির সদস্যরা ${T} টাকার বাজেট করলেন এবং সিদ্ধান্ত নিলেন সবাই সমান চাঁদা দেবেন। কিন্তু ${k} জন সদস্য চাঁদা দিতে রাজি হলেন না, ফলে জনপ্রতি চাঁদা ${d} টাকা বেড়ে গেল। সমিতিতে কতজন সদস্য ছিলেন?`,
 dia:D.area_swap({W:'সদস্য x জন',H:'q টাকা',rm:`${k} জন`,ad:`জনপ্রতি +${d} টাকা`,cap:'মোট টাকা (ক্ষেত্রফল) অপরিবর্তিত'}),hint:`qx = ${T} এবং qx = (x − ${k})(q + ${d})। দ্বিতীয়টি সরল করে q কে x এ লেখো।`,
 steps:[['সমীকরণ',`qx = ${T},  qx = (x − ${k})(q + ${d})`],['q এর মান',`${k}q = ${d}x − ${d*k} ⟹ q = ${m}(x − ${k})`],['বসাই',`${m}x(x − ${k}) = ${T} ⟹ x² − ${k}x − ${T/m} = 0`],['উৎপাদক',`(x − ${x})(x + ${x-k}) = 0 ⟹ x = ${x}`]],ans:[{l:'সদস্য সংখ্যা',v:x,u:'জন'}],fin:`সদস্য ${x} জন`};}},

{id:'e-invest',ch:'c5',t:'দুই হারে বিনিয়োগ',s:'মোট মুনাফা থেকে অংশ',k:'e',make(){
 const pair=pick([[12,10],[10,8],[5,4],[9,6],[7,5]]),ra=pair[0],rb=pair[1],P=pick([40000,50000,56000,60000,80000]),x=ri(Math.floor(P*.2/1000),Math.floor(P*.8/1000))*1000,I=(x*ra+(P-x)*rb)/100;
 return{q:`একজন ব্যক্তি ${P} টাকার কিছু অংশ বার্ষিক ${ra}% এবং বাকি অংশ বার্ষিক ${rb}% মুনাফায় বিনিয়োগ করে এক বছরে মোট ${f(I)} টাকা মুনাফা পেলেন। ${ra}% মুনাফায় তিনি কত টাকা বিনিয়োগ করেছিলেন?`,
 dia:D.hbars({rows:[{l:`মোট ${P} টাকা`,seg:[{w:1,t:`x টাকা (${ra}%)`,k:'o'},{w:1,t:`(${P} − x) টাকা (${rb}%)`,k:'g'}]},{l:'এক বছরের মুনাফা',seg:[{w:1,t:`${ra}x/100`,k:'o'},{w:1,t:`${rb}(${P}−x)/100`,k:'g'}],end:`মোট ${f(I)}`}]}),hint:`${ra}x/100 + ${rb}(${P} − x)/100 = ${f(I)}`,
 steps:[['সমীকরণ',`${ra}x/100 + ${rb}(${P} − x)/100 = ${f(I)}`],['100 দিয়ে গুণ',`${ra}x + ${rb*P} − ${rb}x = ${f(I*100)}`],['সমাধান',`${ra-rb}x = ${f(I*100-rb*P)} ⟹ x = ${x}`]],ans:[{l:`${ra}% এ বিনিয়োগ`,v:x,u:'টাকা'}],fin:`${ra}% এ ${x} টাকা`};}},

{id:'e-bench',ch:'c5',t:'বেঞ্চে বসানো',s:'খালি বেঞ্চ ও দাঁড়ানো ছাত্র',k:'e',make(){
 const p1=pick([6,7,8]),e=pick([2,3]),p2=p1-1,b=ri(p1*e+1,p1*e+9),s=b-p1*e,stu=p1*(b-e);
 return{q:`একটি শ্রেণিকক্ষে প্রতি বেঞ্চে ${p1} জন করে ছাত্র বসালে ${e} টি বেঞ্চ খালি থাকে। কিন্তু প্রতি বেঞ্চে ${p2} জন করে বসালে ${s} জন ছাত্রকে দাঁড়িয়ে থাকতে হয়। বেঞ্চের সংখ্যা ও ছাত্র সংখ্যা কত?`,
 dia:D.benches({b:6,per1:p1,e,per2:p2,s}),hint:`বেঞ্চ b ধরলে 1ম ক্ষেত্রে ছাত্র ${p1}(b − ${e}), 2য় ক্ষেত্রে ${p2}b + ${s}।`,
 steps:[['ছাত্র সংখ্যা দুভাবে',`${p1}(b − ${e}) = ${p2}b + ${s}`],['সরল',`${p1}b − ${p1*e} = ${p2}b + ${s} ⟹ b = ${b}`],['ছাত্র',`${p1} × (${b} − ${e}) = ${stu}`]],ans:[{l:'বেঞ্চ',v:b,u:'টি'},{l:'ছাত্র',v:stu,u:'জন'}],fin:`বেঞ্চ ${b} টি, ছাত্র ${stu} জন`};}},

{id:'e-coins',ch:'c5',t:'মুদ্রার হিসাব',s:'দুই ধরনের মুদ্রা, মোট মূল্য',k:'e',make(){
 let ca,cb,x,y,tot;for(let i=0;i<200;i++){const pr=pick([[25,50],[50,100],[25,100]]);ca=pr[0];cb=pr[1];x=ri(10,90);y=ri(8,60);tot=ca*x+cb*y;if(tot%100===0)break}
 const n=x+y,T=tot/100,nm=c=>c===100?'এক টাকার':c+' পয়সার';
 return{q:`মোট ${n} টি ${nm(ca)} ও ${nm(cb)} মুদ্রায় মোট ${T} টাকা হলে কোন প্রকারের মুদ্রা কয়টি?`,
 dia:D.hbars({rows:[{l:`মোট ${n} টি মুদ্রা`,seg:[{w:1,t:`${ca} পয়সা: x টি`,k:'o'},{w:2,t:`${cb} পয়সা: (${n} − x) টি`,k:'g'}]},{l:`মোট ${tot} পয়সা`,seg:[{w:1,t:`${ca}x`,k:'o'},{w:2,t:`${cb}(${n} − x)`,k:'g'}]}]}),hint:`আগে ${T} টাকা = ${tot} পয়সা লেখো।`,
 steps:[['একক',`${T} টাকা = ${tot} পয়সা`],['সমীকরণ',`${ca}x + ${cb}(${n} − x) = ${tot}`],['সরল',`${cb*n} − ${cb-ca}x = ${tot} ⟹ ${cb-ca}x = ${cb*n-tot} ⟹ x = ${x}`],['অপরটি',`${n} − ${x} = ${y}`]],ans:[{l:`${ca} পয়সার মুদ্রা`,v:x,u:'টি'},{l:`${cb} পয়সার মুদ্রা`,v:y,u:'টি'}],fin:`${ca} পয়সার ${x} টি, ${cb} পয়সার ${y} টি`};}},

{id:'e-pens',ch:'c5',t:'কলম কেনা',s:'একটি বেশি হলে দাম কমে',k:'e',make(){
 const x=ri(8,30),d=pick([1,2,5]),T=d*x*(x+1);
 return{q:`একজন ${T} টাকায় কতগুলো কলম কিনল। ঐ টাকায় একটি কলম বেশি পেলে প্রতিটির দাম গড়ে ${d} টাকা কম পড়ত। সে কতগুলো কলম কিনল?`,
 dia:D.area_swap({wide:1,W:'কলম x টি',H:`দাম ${T}/x`,rm:`${d} টাকা`,ad:'1 টি কলম',cap:`মোট ${T} টাকা একই`}),hint:`${T}/(x + 1) = ${T}/x − ${d}`,
 steps:[['সমীকরণ',`${T}/(x+1) = ${T}/x − ${d}`],['আড়গুণন',`${T}x = (x+1)(${T} − ${d}x) ⟹ ${d}x² + ${d}x − ${T} = 0`],['সরল',`x² + x − ${T/d} = 0`],['উৎপাদক',`(x − ${x})(x + ${x+1}) = 0 ⟹ x = ${x}`]],ans:[{l:'কলম',v:x,u:'টি'}],fin:`${x} টি কলম`};}},

{id:'e-room',ch:'c5',t:'ঘরের মেঝে',s:'দৈর্ঘ্য কমে প্রস্থ বাড়ে, ক্ষেত্রফল একই',k:'e',make(){
 const w=ri(8,22),k=pick([2,3,4,5]),l=w+k,A=w*l;
 return{q:`একটি আয়তাকার ঘরের মেঝের ক্ষেত্রফল ${A} বর্গমিটার। দৈর্ঘ্য ${k} মিটার কমিয়ে প্রস্থ ${k} মিটার বাড়ালে ক্ষেত্রফল অপরিবর্তিত থাকে। দৈর্ঘ্য ও প্রস্থ নির্ণয় কর।`,
 dia:D.area_swap({W:'দৈর্ঘ্য l',H:'প্রস্থ w',rm:`দৈর্ঘ্য −${k}`,ad:`প্রস্থ +${k}`,cap:'ক্ষেত্রফল অপরিবর্তিত'}),hint:`(l − ${k})(w + ${k}) = lw বিস্তার করলে l ও w এর সম্পর্ক পাবে।`,
 steps:[['সম্পর্ক',`lw + ${k}l − ${k}w − ${k*k} = lw ⟹ l = w + ${k}`],['সমীকরণ',`w(w + ${k}) = ${A} ⟹ w² + ${k}w − ${A} = 0`],['উৎপাদক',`(w − ${w})(w + ${l}) = 0 ⟹ w = ${w}`],['দৈর্ঘ্য',`l = ${w} + ${k} = ${l}`]],ans:[{l:'দৈর্ঘ্য',v:l,u:'মিটার'},{l:'প্রস্থ',v:w,u:'মিটার'}],fin:`দৈর্ঘ্য ${l} মি., প্রস্থ ${w} মি.`};}},

{id:'h-elev1',ch:'c10',t:'উন্নতি কোণ',s:'উচ্চতা, দূরত্ব বা মই',k:'h',make(){
 const a=pick([30,45,60]),tr=TR[a],v=ri(1,3);
 if(v===1){const d=ri(10,60),h=d*tr.t;
  return{q:`একটি গাছের পাদদেশ থেকে ${d} মিটার দূরে ভূতলের একটি বিন্দুতে গাছের চূড়ার উন্নতি কোণ ${a}°। গাছটির উচ্চতা নির্ণয় কর। (দুই দশমিক ঘর)`,dia:D.elev({ang:a,L:{h:'h = ?',d:`${d} মি.`}}),hint:`tan ${a}° = ${tr.tn}`,
  steps:[['সূত্র',`tan ${a}° = h/${d}`],['মান',`${tr.tn} = h/${d}`],['উত্তর',`h = ${d} × ${tr.tn} ≈ ${f(h)}`]],ans:[{l:'উচ্চতা',v:+h.toFixed(2),u:'মিটার'}],fin:`উচ্চতা ≈ ${f(h)} মিটার`};}
 if(v===2){const h=ri(10,60),d=h/tr.t;
  return{q:`একটি মিনারের উচ্চতা ${h} মিটার। মিনারের পাদদেশ থেকে কিছু দূরে একটি স্থানে মিনারের শীর্ষের উন্নতি কোণ ${a}°। ঐ স্থান থেকে মিনারের দূরত্ব নির্ণয় কর। (দুই দশমিক ঘর)`,dia:D.elev({ang:a,L:{h:`${h} মি.`,d:'x = ?'}}),hint:`tan ${a}° = ${tr.tn}`,
  steps:[['সূত্র',`tan ${a}° = ${h}/x`],['মান',`${tr.tn} = ${h}/x`],['উত্তর',`x = ${h} ÷ (${tr.tn}) ≈ ${f(d)}`]],ans:[{l:'দূরত্ব',v:+d.toFixed(2),u:'মিটার'}],fin:`দূরত্ব ≈ ${f(d)} মিটার`};}
 const L=ri(8,30),h=L*sinv(a);
 return{q:`${L} মিটার দৈর্ঘ্যের একটি মই ভূমির সাথে ${a}° কোণ উৎপন্ন করে দেওয়ালের ছাদ স্পর্শ করে। দেওয়ালের উচ্চতা নির্ণয় কর। (দুই দশমিক ঘর)`,dia:D.elev({ang:a,L:{h:'h = ?',hyp:`মই ${L} মি.`}}),hint:`মই হলো অতিভুজ। sin ${a}° = ${tr.sn}`,
 steps:[['সূত্র',`sin ${a}° = h/${L}`],['মান',`${tr.sn} = h/${L}`],['উত্তর',`h = ${L} × ${tr.sn} ≈ ${f(h)}`]],ans:[{l:'উচ্চতা',v:+h.toFixed(2),u:'মিটার'}],fin:`উচ্চতা ≈ ${f(h)} মিটার`};}},

{id:'h-elev2',ch:'c10',t:'দুই স্থান থেকে দেখা',s:'পিছিয়ে গেলে কোণ কমে',k:'h',make(){
 const pr=pick([[60,30],[60,45],[45,30]]),a1=pr[0],a2=pr[1],b=pick([20,25,30,40,50,60]),h=b/(cotv(a2)-cotv(a1)),x=h*cotv(a1);
 return{q:`ভূতলে কোনো স্থান থেকে একটি মিনারের শীর্ষের উন্নতি কোণ ${a1}°। ঐ স্থান থেকে ${b} মিটার পিছিয়ে গেলে উন্নতি কোণ ${a2}° হয়। মিনারের উচ্চতা এবং প্রথম স্থান থেকে মিনারের গোড়ার দূরত্ব নির্ণয় কর। (দুই দশমিক ঘর)`,
 dia:D.elev2({a1,a2,L:{h:'h',back:`${b} মি.`,x:'x'}}),hint:`কাছে x = h/tan ${a1}°, দূরে x + ${b} = h/tan ${a2}°।`,
 steps:[['কাছের স্থান',`tan ${a1}° = h/x ⟹ x = h × ${TR[a1].ct}`],['দূরের স্থান',`tan ${a2}° = h/(x + ${b}) ⟹ x + ${b} = h × ${TR[a2].ct}`],['বিয়োগ',`h(${TR[a2].ct} − ${TR[a1].ct}) = ${b} ⟹ h ≈ ${f(h)}`],['দূরত্ব',`x = h × ${TR[a1].ct} ≈ ${f(x)}`]],ans:[{l:'মিনারের উচ্চতা',v:+h.toFixed(2),u:'মিটার'},{l:'প্রথম স্থান থেকে দূরত্ব',v:+x.toFixed(2),u:'মিটার'}],fin:`উচ্চতা ≈ ${f(h)} মি., দূরত্ব ≈ ${f(x)} মি.`};}},

{id:'h-broken',ch:'c10',t:'ভাঙা খুঁটি',s:'ভাঙা অংশ ও দণ্ডায়মান অংশ',k:'h',make(){
 const a=pick([30,45,60]),d=ri(8,20),tr=TR[a],x=d/tr.t,L=d/sinv(a),tot=x+L;
 return{q:`একটি খুঁটি এমনভাবে ভেঙে গেল যে ভাঙা অংশ দণ্ডায়মান অংশের সাথে ${a}° কোণ করে খুঁটির গোড়া থেকে ${d} মিটার দূরে মাটি স্পর্শ করে। খুঁটির সম্পূর্ণ দৈর্ঘ্য নির্ণয় কর। (দুই দশমিক ঘর)`,
 dia:D.broken({mode:'apex',ang:a,L:{base:`${d} মি.`,st:'x',br:'L',tot:'মোট = x + L'}}),hint:`${a}° কোণের বিপরীত বাহু ${d}। দণ্ডায়মান অংশের জন্য tan, ভাঙা অংশের জন্য sin।`,

{id:'r-ratio3',ch:'c11',t:'তিন জনের ভাগ',s:'দুটি অনুপাত জুড়ে একটি করা',k:'r',make(){

{id:'d-age',ch:'c12',t:'বয়সের সমীকরণজোট',s:'আগের ও পরের শর্ত',k:'d',make(){

{id:'d-boat',ch:'c12',t:'নৌকা ও স্রোত',s:'অনুকূল ও প্রতিকূল বেগ',k:'d',make(){

{id:'d-salary',ch:'c12',t:'বেতন বৃদ্ধি',s:'শুরুর বেতন ও বার্ষিক বৃদ্ধি',k:'d',make(){

{id:'d-poly',ch:'c12',t:'বহুভুজের কর্ণ',s:'বাহুর সমষ্টি ও কর্ণের সমষ্টি',k:'d',make(){

function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const M=1400,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};im.src=r.result};r.readAsDataURL(file)})}
