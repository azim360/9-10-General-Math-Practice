@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --seg:#636366; --fill:rgba(120,120,128,.26);
  --ink:#FFFFFF; --ink2:rgba(235,235,245,.64); --ink3:rgba(235,235,245,.28); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
  --blue-d:#5EA9FF; --green-d:#4CD964; --red-d:#FF7A72; --orange-d:#FFB340;
  --blue-t:rgba(10,132,255,.22); --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.22); --purple-t:rgba(191,90,242,.22);
  --nav:rgba(22,22,24,.82); --shadow:0 3px 8px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --seg:#636366; --fill:rgba(120,120,128,.26);
  --ink:#FFFFFF; --ink2:rgba(235,235,245,.64); --ink3:rgba(235,235,245,.28); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
  --blue-d:#5EA9FF; --green-d:#4CD964; --red-d:#FF7A72; --orange-d:#FFB340;
  --blue-t:rgba(10,132,255,.22); --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.22); --purple-t:rgba(191,90,242,.22);
  --nav:rgba(22,22,24,.82); --shadow:0 3px 8px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nav + tab bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.navin{height:46px;display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:8px}
.ttl{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;max-width:46vw}
.nav.scrolled .ttl{opacity:1}
.nbtn{background:none;border:0;color:var(--blue);font:400 17px/1 var(--font);padding:10px 4px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;min-height:44px}
.nbtn svg{width:11px;height:19px}
#nr{justify-self:end}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);height:52px}
.tab{background:none;border:0;color:var(--ink2);font:500 10.5px/1.1 var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tab svg{width:26px;height:26px}
.tab[aria-current="true"]{color:var(--blue)}

main{padding-top:2px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.lt{font:700 34px/1.3 var(--font);letter-spacing:-.2px;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--ink2);font-size:15px;line-height:1.5;margin:0 0 14px}
.eb{font:600 13px/1.3 var(--font);color:var(--blue-d);margin:6px 0 0;letter-spacing:.2px}
.gh{font:400 13px/1.35 var(--font);color:var(--ink2);margin:22px 16px 7px;letter-spacing:.2px}
.gf{font:400 13px/1.5 var(--font);color:var(--ink2);margin:7px 16px 0}
.gap{height:14px}

/* grouped list */
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;min-height:54px;position:relative;cursor:pointer;color:inherit;width:100%;border:0;background:none;text-align:left;font:inherit}
.row+.row::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
.row:active{background:var(--fill)}
.ic{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff}
.ic svg{width:20px;height:20px}
.c-a{background:var(--teal)}.c-e{background:var(--red)}.c-h{background:var(--blue)}.c-r{background:var(--orange)}.c-d{background:var(--purple)}
.mth,.callout,.ans .v,.q{overflow-wrap:anywhere}
.tg{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3,#8e8e93);box-sizing:border-box;display:inline-block;position:relative;cursor:pointer}
.tg.on{background:var(--green);border-color:var(--green)}.tg.on::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.sr{flex:none;color:var(--orange);font-size:13px;letter-spacing:1px}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
.starb{border:0;background:none;font-size:28px;line-height:1;color:var(--ink3,#c7c7cc);cursor:pointer;padding:4px}.starb.on{color:var(--orange)}
.donebtn{border:0;border-radius:999px;padding:10px 16px;font:600 15px/1 var(--font);background:var(--blue);color:#fff;cursor:pointer}.donebtn.on{background:var(--green)}
.note{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:12px 14px;font:400 16px/1.6 var(--font);resize:vertical;margin:0 0 10px}
.card .note{background:var(--bg,#f2f2f7)}
.filebtn{display:block;text-align:center;padding:12px;border-radius:12px;background:var(--bg,#f2f2f7);color:var(--blue);font:600 15px/1 var(--font);cursor:pointer;margin:8px 0}
#nc{padding:0 0 8px}#nc .chipbar{padding:0 max(16px,env(safe-area-inset-left,0px))}
@media print{.rail,.nav,.tabbar,#nc,.btns,.chipbar,.tools,.pager{display:none!important}body{background:#fff!important}details.rv{break-inside:avoid;border:1px solid #ccc}}
details.rv{background:var(--card);border-radius:12px;overflow:hidden}
details.rv summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none}
details.rv summary::-webkit-details-marker{display:none}.rvb{padding:0 16px 16px}
.fcard.solo{grid-template-columns:1fr}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chipb{flex:none;border:0;border-radius:999px;padding:8px 14px;font:500 14px/1 var(--font);background:var(--card);color:var(--ink);cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--blue);color:#fff}
.c-t{background:var(--blue)}.c-q{background:var(--green)}.c-c{background:var(--orange)}.c-s{background:var(--purple)}
.rb{flex:1;min-width:0}
.t1{font-size:16px;font-weight:500;line-height:1.4}
.t2{font-size:13px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t2.full{display:block;-webkit-line-clamp:unset;overflow:visible;font-size:14.5px;line-height:1.65;margin-top:3px;overflow-wrap:anywhere}
.chev{flex:none;width:8px;height:14px;color:var(--ink3)}
.dn{flex:none;width:22px;height:22px;color:var(--green)}
.badge{flex:none;font:500 13px/1 var(--font);color:var(--ink2);font-variant-numeric:tabular-nums}

.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin:8px 0 12px}
.search svg{width:16px;height:16px;color:var(--ink2);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:400 17px/1 var(--font);color:var(--ink);outline:0;height:100%}
.search input::placeholder{color:var(--ink2)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 6px;border-radius:7px;font:500 13.5px/1.2 var(--font);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--seg);box-shadow:var(--shadow);font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 16px;background:var(--blue);color:#fff;font:600 17px/1.3 var(--font);cursor:pointer;min-height:50px}
.btn:active{opacity:.7}
.btn.t{background:var(--blue-t);color:var(--blue-d)}
.btn.g{background:var(--fill);color:var(--ink)}
.btn.sm{width:auto;padding:8px 14px;font-size:15px;border-radius:10px;min-height:38px}
.btn[disabled]{opacity:.4;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1;min-width:140px}

/* detail */
.card{background:var(--card);border-radius:12px;padding:14px 16px}
.q{font-size:17px;line-height:1.75;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--fill);border-radius:8px;padding:3px 10px;font-size:14px;line-height:1.7}
.dia{width:100%;max-width:470px;height:auto;display:block;margin:0 auto}
.cap{font-size:12px;color:var(--ink2);text-align:center;margin:6px 0 0}
.callout{border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.7;background:var(--blue-t)}
.callout .l{display:block;font:600 12.5px/1.4 var(--font);letter-spacing:.2px;color:var(--blue-d);margin-bottom:2px}
.callout.o{background:var(--orange-t)}.callout.o .l{color:var(--orange-d)}
.callout.p{background:var(--purple-t)}.callout.p .l{color:var(--purple)}
.stack>*+*{margin-top:12px}
.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:13px 14px;position:relative}
.st+.st::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--sep)}
.st .n{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font:600 13px/26px var(--font);text-align:center;margin-top:1px}
.st h4{margin:0;font:600 15px/1.5 var(--font)}
.mth{font-size:16px;line-height:2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.st.new{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.st.new,.sheet{animation:none!important}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 2px;font-size:.92em}
.fr>i{font-style:normal;border-bottom:1px solid currentColor;padding:0 3px}
.fr>b{font-weight:inherit;padding:0 3px}
.rt{white-space:nowrap}.rt .ov{border-top:1px solid currentColor;padding:0 1px}
.ans{background:var(--green-t);border-radius:12px;padding:14px 16px}
.ans .l{display:block;font:600 12.5px/1.4 var(--font);color:var(--green-d);letter-spacing:.2px}
.ans .v{font-size:19px;font-weight:600;line-height:1.5}
.ans .c{font-size:14px;color:var(--ink2);margin-top:4px}

.f{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:54px;position:relative}
.f+.f::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.f label{flex:1;min-width:0;font-size:16px;line-height:1.4}
.f input{width:112px;text-align:right;border:0;background:var(--fill);border-radius:9px;padding:9px 10px;font:500 17px/1.2 var(--font);color:var(--ink);font-variant-numeric:tabular-nums;outline-offset:1px}
.f .u{font-size:13px;color:var(--ink2);min-width:58px;line-height:1.3}
.f.ok input{background:var(--green-t);color:var(--green-d)}
.f.bad input{background:var(--red-t);color:var(--red-d)}
.fb{display:none;border-radius:12px;padding:11px 14px;font-size:15.5px;line-height:1.6}
.fb.ok{display:block;background:var(--green-t);color:var(--green-d);font-weight:600}
.fb.bad{display:block;background:var(--red-t);color:var(--red-d)}
.fb.part{display:block;background:var(--orange-t);color:var(--orange-d)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager .btn{justify-content:flex-start;font-weight:500;font-size:15px;text-align:left}
.pager .btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager .btn:last-child{justify-content:flex-end;text-align:right}

/* formulas */
.fcard{background:var(--card);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px;align-items:center}
.fcard .dia{max-width:128px}
.fcard h3{margin:0 0 4px;font:600 17px/1.4 var(--font)}
.fl{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.85}
.fl li{overflow-wrap:anywhere}
.fl b{font-weight:600;color:var(--blue-d)}
@media (max-width:420px){.fcard{grid-template-columns:1fr}.fcard .dia{max-width:200px}}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.flow>div{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;font-size:13.5px;line-height:1.5}
.flow b{display:block;color:var(--blue-d);font-size:20px;font-weight:700;line-height:1.3}

/* progress */
.ringbox{display:flex;align-items:center;gap:18px}
.ring{width:112px;height:112px;flex:none}
.ring circle{fill:none;stroke-width:12}
.ring .bgc{stroke:var(--fill)}
.ring .fgc{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring text{font:700 24px/1 var(--font);fill:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.pr{padding:12px 14px;position:relative}
.pr+.pr::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.pr .h{display:flex;justify-content:space-between;gap:10px;font-size:15.5px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat>div{background:var(--card);border-radius:12px;padding:12px 6px}
.stat b{display:block;font:700 24px/1.3 var(--font);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2);line-height:1.4;display:block}
.empty{text-align:center;color:var(--ink2);padding:28px 16px;font-size:15px}
.tiny{font-size:13px;color:var(--ink2);line-height:1.6}

/* diagrams */
.ln{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln.d{stroke:var(--ink2);stroke-dasharray:4 4;stroke-width:1.3}
.ln.hi{stroke:var(--blue);stroke-width:2.6}.ln.gr{stroke:var(--green);stroke-width:2.6}.ln.rd{stroke:var(--red);stroke-width:2.6}.ln.or{stroke:var(--orange);stroke-width:3}
.pg{fill:var(--blue-t);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.pg.o{fill:var(--orange-t)}.pg.g{fill:var(--green-t)}.pg.r{fill:var(--red-t)}.pg.p{fill:var(--purple-t)}.pg.w{fill:var(--card)}.pg.n{fill:none}
.pg.b2{fill:var(--blue-t)}.pg.b3{fill:var(--blue-t);opacity:.75}
.pg.sw{stroke-width:1}
.tx{fill:var(--ink);font-size:12.5px;font-family:var(--font)}
.tx.m{fill:var(--blue-d);font-weight:600}.tx.s{fill:var(--ink2);font-size:11.5px}.tx.r{fill:var(--red-d);font-weight:600}.tx.gn{fill:var(--green-d);font-weight:600}.tx.or{fill:var(--orange-d);font-weight:600}.tx.big{font-size:20px;font-weight:600}
.pt{fill:var(--ink)}
.ra{fill:none;stroke:var(--ink2);stroke-width:1.2}
.arc{fill:none;stroke:var(--ink2);stroke-width:1.3}

/* logo */
.logo{display:block;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.25);object-fit:cover;background:var(--fill)}
.logo.sm{height:34px;width:auto;margin:0 0 0 2px}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
.hero .logo{height:88px;width:auto;flex:none;border-radius:12px}
.hero .ht{min-width:0}
.hero .ht .lt{margin:2px 0 0}
.hero .ht .eb{margin-top:0}

.langb{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:8px;height:30px;padding:0 12px;border:0;border-radius:15px;background:var(--fill);color:var(--blue);font:600 14px/1 var(--font);cursor:pointer;z-index:2}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:88vw;background:rgba(40,40,44,.94);color:#fff;font:500 14px/1.4 var(--font);padding:10px 16px;border-radius:14px;z-index:50}

/* desktop side rails: fill the empty space beside the centred column */
.rail{display:none}
@media (min-width:1240px){
 :root{--mw:clamp(680px,calc(100vw - 612px),760px)}
 main.wrap,.nav .wrap{max-width:var(--mw)}
 .rail{display:block;position:fixed;z-index:10;top:var(--navh,110px);bottom:calc(52px + env(safe-area-inset-bottom,0px) + 10px);width:min(340px,calc((100vw - var(--mw))/2 - 36px));overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 12px;scrollbar-width:thin;scrollbar-color:var(--ink3) transparent}
 #rail-l{right:calc(50% + var(--mw)/2 + 18px)}
 #rail-r{left:calc(50% + var(--mw)/2 + 18px)}
 #view{container-type:inline-size}
}
@media (min-width:1240px) and (max-width:1499px){
 #rail-r{display:none}
 #rail-l{right:auto;left:20px;width:260px}
 main.wrap{max-width:760px;margin-left:max(296px,calc(296px + (100vw - 316px - 760px)/2));margin-right:auto}
 .nav .wrap{max-width:none;margin:0}
}
/* single-column problem page (desktop): compact stack, the two reference callouts sit side by side */
.dcols>.dB{margin-top:12px}
@container (min-width:700px){
 .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
 .fgrid>*+*{margin-top:0}
 .dA{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .dA>*{grid-column:1/-1;margin-top:0!important}
 .dA>.callout{grid-column:auto}
}
.rail .rc{background:var(--card);border-radius:12px;padding:12px 10px}
.rail .rc+.rc{margin-top:12px}
.rail .rtt{font:600 17px/1.4 var(--font);margin:2px 4px 0}
.rail .eb{margin:0 4px}
.rail .bar{margin:10px 4px 0}
.rail .tiny{margin:6px 4px 0}
.rail .gh{margin:12px 6px 4px;font-weight:600}
.rail .rc>.gh:first-child{margin-top:2px}
.ri{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:9px;cursor:pointer;font:inherit;color:inherit;min-height:44px}
.ri:hover{background:var(--fill)}
.ri.cur{background:var(--blue-t)}
.ri .rn{display:block;font:500 12px/1.3 var(--font);color:var(--ink2)}
.ri .rg{display:block;font:500 14px/1.4 var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri.cur .rn{color:var(--blue-d)}
.ri .ic{width:26px;height:26px;border-radius:7px}.ri .ic svg{width:16px;height:16px}
.ri .badge{font-size:12px}
.dk{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink3,#8e8e93);position:relative}
.dk.on{background:var(--green);border-color:var(--green)}
.dk.on::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rf{padding:6px 6px 8px}.rf+.rf{border-top:.5px solid var(--sep)}
.rf .rft{font:600 14px/1.4 var(--font);margin-bottom:2px}
.rf .fl{font-size:14px;line-height:1.75}
.ring.sm{width:84px;height:84px}
.rail .ringbox{padding:4px 6px;gap:14px}
.kb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 6px;font-size:13.5px;color:var(--ink2)}
kbd{font:600 12px/1 var(--font);background:var(--fill);color:var(--ink);border-radius:6px;padding:4px 7px;min-width:24px;text-align:center;display:inline-block}

/* note images */

/* ---------- helpers ---------- */
const N=(v,d=1)=>+(+v).toFixed(d);
const svg=(inner,h=205)=>`<svg class="dia" viewBox="0 0 320 ${h}" role="img" aria-label="সমস্যার চিত্র">${inner}</svg>`;
const ln=(a,b,c,d,k='')=>`<line x1="${N(a)}" y1="${N(b)}" x2="${N(c)}" y2="${N(d)}" class="ln ${k}"/>`;
const L2=(p,q,k='')=>ln(p[0],p[1],q[0],q[1],k);
const pg=(pts,k='')=>`<polygon points="${pts.map(p=>N(p[0])+','+N(p[1])).join(' ')}" class="pg ${k}"/>`;
const tx=(x,y,t,k='',a='middle')=>`<text x="${N(x)}" y="${N(y)}" text-anchor="${a}" class="tx ${k}">${t}</text>`;
const ci=(x,y,r,k='')=>`<circle cx="${N(x)}" cy="${N(y)}" r="${N(r)}" class="pg ${k}"/>`;
const pth=(d,k='ln')=>`<path d="${d}" class="${k}"/>`;
const dot=(p)=>`<circle cx="${N(p[0])}" cy="${N(p[1])}" r="2.6" class="pt"/>`;
const unit=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]};
const foot=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);return[a[0]+t*dx,a[1]+t*dy]};
const rm=(f,p,a,s=8)=>{const u=unit(f,p),v=unit(f,a);return pth(`M${N(f[0]+u[0]*s)},${N(f[1]+u[1]*s)}L${N(f[0]+(u[0]+v[0])*s)},${N(f[1]+(u[1]+v[1])*s)}L${N(f[0]+v[0]*s)},${N(f[1]+v[1]*s)}`,'ra')};
const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
const lg=(x,y,arr)=>arr.map((a,i)=>`<rect x="${x}" y="${y+i*17}" width="11" height="11" rx="3" class="pg ${a[0]} sw"/>`+tx(x+16,y+i*17+10,a[1],'s','start')).join('');
const fr=(n,d)=>`<span class="fr"><i>${n}</i><b>${d}</b></span>`;
const rt=x=>`<span class="rt">√<span class="ov">${x}</span></span>`;
const lab=(P,t)=>P.map((p,i)=>tx(p[0]+t[i][0],p[1]+t[i][1],t[i][2],'s')).join('');

/* ---------- diagrams ---------- */
const D={
tri_eq(p){const W=186,bx=66,by=182,w2=W*.62,k=p.k||1;
 const O=[[bx,by],[bx+W,by],[bx+W/2,by-W*.866]],I=[[bx,by],[bx+w2,by],[bx+w2/2,by-w2*.866]];
 return svg(pg(O,'o')+pg(I)+ln(bx+w2,by,bx+W,by,'or')+
  tx(bx+w2/2,by-7,'a','m')+tx(bx+w2+(W-w2)/2,by-8,'+'+k,'or')+tx(bx+W/2,by+16,p.lo||('a + '+k),'')+
  tx(6,24,p.n1||'বাড়তি ক্ষেত্রফল','s','start')+tx(6,41,p.n2||'','m','start')+lg(232,24,[['','আগের ত্রিভুজ'],['o','বাড়ার পর']]));},

tri_iso(p){const A=[160,30],B=[56,168],C=[264,168],H=[160,168];
 return svg(pg([A,B,C])+L2(A,H,'d')+rm(H,A,C)+dot(A)+
  tx(160,191,'ভূমি b = '+p.b,'m')+tx(100,92,'a = '+(p.a||'?'),'r','end')+tx(167,108,p.h||'h','','start')+
  tx(312,26,'ক্ষেত্রফল','s','end')+tx(312,44,p.area,'m','end')+tx(160,20,'A','s')+tx(50,184,'B','s','end')+tx(270,184,'C','s','start')+tx(160,184,'H','s','end'));},

roads(p){const th=p.th*Math.PI/180,c=Math.cos(th),s=Math.sin(th),k=228/(p.ab+p.ac*Math.abs(c));
 const A=[30+p.ac*k*Math.abs(c),172],B=[A[0]+p.ab*k,172],C=[A[0]+p.ac*k*c,172-p.ac*k*s],Dd=[C[0],172];
 const ar=(r,a1,a2,sw)=>`M${N(A[0]+r*Math.cos(a1))},${N(A[1]-r*Math.sin(a1))}A${r},${r} 0 0 ${sw} ${N(A[0]+r*Math.cos(a2))},${N(A[1]-r*Math.sin(a2))}`;
 const mc=mid(A,C),pa=[s,c];
 return svg(L2(Dd,A,'d')+L2(C,Dd,'d')+rm(Dd,C,A)+L2(A,B,'hi')+L2(A,C,'gr')+L2(C,B,'rd')+
  pth(ar(26,0,th,0),'arc')+pth(ar(15,Math.PI,th,1),'arc')+
  tx(A[0]+40*Math.cos(th/2),A[1]-40*Math.sin(th/2)+4,p.th+'°','m')+
  tx(A[0]+28*Math.cos((Math.PI+th)/2)-4,A[1]-28*Math.sin((Math.PI+th)/2)+14,(180-p.th)+'°','s')+

 steps:[['দূরত্ব হিসাব','AB = 5 × 10 = 50 কি.মি.<br>AC = 5 × 8 = 40 কি.মি.<br>∠BAC = 120°'],
  ['লম্ব টানি','C থেকে BA এর বর্ধিতাংশে CD লম্ব।<br>∠DAC = 180° − 120° = 60°'],
  ['CD ও AD',`CD = AC sin 60° = 40 × ${fr('√3','2')} = 20√3<br>AD = AC cos 60° = 40 × ½ = 20`],
  ['সমকোণী △BCD','BC² = (BA + AD)² + CD²<br>= (50 + 20)² + (20√3)²<br>= 4900 + 1200 = 6100'],
  ['উত্তর',`BC = ${rt('6100')} ≈ 78.1`],
  ['দ্রুত যাচাই (cosine সূত্র)','BC² = 50² + 40² − 2·50·40·cos 120° = 2500 + 1600 + 2000 = 6100 ✓']],
 ans:[{l:'সরাসরি দূরত্ব',v:78.1,u:'কি.মি.'}],fin:'সরাসরি দূরত্ব ≈ 78.1 কিলোমিটার'},

{id:'ex8',sec:'ex1',no:'উদাহরণ ৮',k:'q',gist:'আয়তাকার ঘর: পরিসীমা ও কর্ণ',
 q:'একটি আয়তাকার ঘরের দৈর্ঘ্য প্রস্থের 3/2 গুণ। এর ক্ষেত্রফল 384 বর্গমিটার হলে পরিসীমা ও কর্ণের দৈর্ঘ্য নির্ণয় কর।',
 f:['ক্ষেত্রফল = দৈর্ঘ্য × প্রস্থ','পরিসীমা = 2(l + b)',`কর্ণ = ${rt('l² + b²')}`],
 idea:'প্রস্থকে x ধরলে দৈর্ঘ্য (3/2)x। ক্ষেত্রফল থেকে x, তারপর বাকি সব সরল।',
 dia:()=>D.rect({l:'দৈর্ঘ্য = (3/2)x',w:'প্রস্থ = x',diag:1,area:'384 বর্গমি.'}),
 steps:[['অজানা ধরি',`প্রস্থ x মিটার, দৈর্ঘ্য ${fr('3','2')}x মিটার`],
  ['ক্ষেত্রফল',`${fr('3','2')}x² = 384 ⟹ 3x² = 768 ⟹ x² = 256<br>⟹ x = 16`],
  ['মাপ','প্রস্থ = 16 মি.<br>দৈর্ঘ্য = (3/2) × 16 = 24 মি.'],
  ['পরিসীমা','2(24 + 16) = 80 মিটার'],
  ['কর্ণ',`${rt('24² + 16²')} = ${rt('832')} ≈ 28.84 মিটার`]],
 ans:[{l:'পরিসীমা',v:80,u:'মিটার'},{l:'কর্ণ',v:28.84,u:'মিটার'}],fin:'পরিসীমা 80 মিটার, কর্ণ ≈ 28.84 মিটার'},

{id:'ex9',sec:'ex1',no:'উদাহরণ ৯',k:'q',gist:'দৈর্ঘ্য ১০ কমালে বর্গ হয়',
 q:'একটি আয়তক্ষেত্রের ক্ষেত্রফল 2000 বর্গমিটার। যদি এর দৈর্ঘ্য 10 মিটার কম হত তাহলে এটি একটি বর্গক্ষেত্র হত। আয়তক্ষেত্রটির দৈর্ঘ্য ও প্রস্থ নির্ণয় কর।',
 f:['বর্গ হলে দৈর্ঘ্য = প্রস্থ','x(x − 10) = 2000'],
 idea:'দৈর্ঘ্য 10 কমলে প্রস্থের সমান হয়, তাই প্রস্থ = দৈর্ঘ্য − 10। একটি অজানা দিয়েই সমীকরণ হয়ে যায়।',
 dia:()=>D.rect_cut({l:'দৈর্ঘ্য x',w:'y',d:'10 মি.'}),
 steps:[['সম্পর্ক লিখি','দৈর্ঘ্য x, প্রস্থ y<br>xy = 2000 …(1)<br>x − 10 = y …(2)'],
  ['(2) কে (1) এ বসাই','x(x − 10) = 2000 ⟹ x² − 10x − 2000 = 0'],
  ['উৎপাদকে ভাঙি','x² − 50x + 40x − 2000 = 0<br>⟹ (x − 50)(x + 40) = 0<br>⟹ x = 50 অথবা x = −40'],
  ['ঋণাত্মক মান বাদ','দৈর্ঘ্য ঋণাত্মক হয় না, তাই x = 50'],
  ['প্রস্থ','y = 50 − 10 = 40']],
 tip:'দ্বিঘাত সমীকরণে দুটি মান আসে। যে মানটি ঋণাত্মক বা অসম্ভব, সেটি বাদ দিতে ভুলো না।',
 chk:'যাচাই: 50 × 40 = 2000 ✓',
 ans:[{l:'দৈর্ঘ্য',v:50,u:'মিটার'},{l:'প্রস্থ',v:40,u:'মিটার'}],fin:'দৈর্ঘ্য 50 মিটার, প্রস্থ 40 মিটার'},

{id:'ex10',sec:'ex1',no:'উদাহরণ ১০',k:'q',gist:'বর্গাকার মাঠের ভিতরে রাস্তা, ১ হেক্টর',
 q:'বর্গাকার একটি মাঠের ভিতরে চারদিকে 4 মিটার চওড়া একটি রাস্তা আছে। যদি রাস্তার ক্ষেত্রফল 1 হেক্টর হয়, তবে রাস্তা বাদে মাঠের ভিতরের ক্ষেত্রফল নির্ণয় কর।',
 f:['1 হেক্টর = 10000 বর্গমিটার','a² − b² = (a − b)(a + b)'],
 idea:'রাস্তা মাঠের ভিতরে, তাই ভিতরের বর্গের বাহু দুই পাশে 4 + 4 = 8 মিটার ছোট। বড় বর্গ − ছোট বর্গ = রাস্তা।',
 dia:()=>D.field_road({w:'4 মি.',inner:'(x − 8) বাহু',outer:'পুরো মাঠের বাহু = x মিটার'}),
 steps:[['একক মেলাই','1 হেক্টর = 10000 বর্গমিটার'],
  ['ভিতরের বাহু','মাঠের বাহু x মিটার<br>রাস্তা বাদে বাহু = x − 2×4 = (x − 8) মিটার'],
  ['রাস্তার ক্ষেত্রফল','x² − (x − 8)² = (x − (x−8))(x + (x−8)) = 8(2x − 8) = 16x − 64'],
  ['সমীকরণ','16x − 64 = 10000 ⟹ 16x = 10064 ⟹ x = 629'],
  ['ভিতরের মাঠ','(629 − 8)² = 621² = 385641 বর্গমিটার<br>= 38.56 হেক্টর (প্রায়)']],
 tip:'উত্তর হেক্টরে চাওয়া হয়েছে। বর্গমিটারকে 10000 দিয়ে ভাগ করতে ভুলো না।',
 ans:[{l:'ভিতরের ক্ষেত্রফল',v:38.56,u:'হেক্টর'}],fin:'ক্ষেত্রফল ≈ 38.56 হেক্টর'},

{id:'ex11',sec:'ex1',no:'উদাহরণ ১১',k:'q',gist:'সামান্তরিকের কর্ণের উপর লম্ব',
 q:'একটি সামান্তরিকক্ষেত্রের ক্ষেত্রফল 120 বর্গ সে.মি. এবং একটি কর্ণ 24 সে.মি.। কর্ণটির বিপরীত কৌণিক বিন্দু থেকে উক্ত কর্ণের উপর অঙ্কিত লম্বের দৈর্ঘ্য নির্ণয় কর।',
 f:['সামান্তরিকের ক্ষেত্রফল = কর্ণ × লম্ব'],
 idea:'কর্ণ সামান্তরিককে দুটি সমান ত্রিভুজে ভাগ করে। দুই ত্রিভুজের উচ্চতা একই, তাই ক্ষেত্রফল = d × h।',
 dia:()=>D.para({dBD:1,perp:1,L:{bd:'d = 24',perp:'h = ?'}}),
 steps:[['কেন d × h?','প্রতিটি ত্রিভুজ = ½ × 24 × h<br>দুটি মিলে = 24 × h'],
  ['সমীকরণ','24 × h = 120'],['উত্তর','h = 120 ÷ 24 = 5']],
 ans:[{l:'লম্বের দৈর্ঘ্য',v:5,u:'সে.মি.'}],fin:'লম্বের দৈর্ঘ্য 5 সে.মি.'},

{id:'ex12',sec:'ex1',no:'উদাহরণ ১২',k:'q',gist:'সামান্তরিকের অপর কর্ণ',
 q:'একটি সামান্তরিকের বাহুর দৈর্ঘ্য 12 মিটার ও 8 মিটার এবং ক্ষুদ্রতম কর্ণটি 10 মিটার হলে অপর কর্ণটির দৈর্ঘ্য নির্ণয় কর।',
 f:['হেরন: √(s(s−a)(s−b)(s−c))','d₁² + d₂² = 2(a² + b²)'],
 idea:'বইয়ের পথে লম্ব টেনে ধাপে ধাপে যেতে হয়। শেষে একটি শর্টকাট সূত্রও দেখানো হলো যা এক লাইনে একই উত্তর দেয়।',
 dia:()=>D.para({ext:1,dBD:1,dAC:1,L:{ab:'AB = 12',ad:'AD = 8',h:'DF',bd:'BD = 10',ac:'AC = ?'}}),
 steps:[['△ABD এর ক্ষেত্রফল',`s = (12 + 10 + 8)/2 = 15<br>ক্ষেত্রফল = ${rt('15×3×5×7')} = ${rt('1575')} ≈ 39.69`],
  ['লম্ব DF','½ × 12 × DF = 39.69 ⟹ DF ≈ 6.61'],
  ['BE বের করি','BE² = BC² − CE² = 8² − 6.61² ≈ 20.3 ⟹ BE ≈ 4.5'],
  ['AE','AE = AB + BE = 12 + 4.5 = 16.5'],
  ['কর্ণ AC','AC² = AE² + CE² = 16.5² + 6.61² ≈ 316 ⟹ AC ≈ 17.78'],
  ['শর্টকাট','দুই কর্ণের বর্গের যোগফল = চার বাহুর বর্গের যোগফল<br>10² + d² = 2(12² + 8²) = 416<br>d² = 316 ⟹ d = 17.78 ✓']],
 note:'বইয়ে 17.77 ছাপা আছে, কারণ মাঝের ধাপে দশমিক ছেঁটে হিসাব করা হয়েছে। সঠিক মান √316 = 17.776… ≈ 17.78। পরীক্ষায় 17.77 লিখলেও চলবে।',
 ans:[{l:'অপর কর্ণ',v:17.78,u:'মিটার'}],fin:'অপর কর্ণ ≈ 17.78 মিটার (বইয়ে 17.77)'},

{id:'ex13',sec:'ex1',no:'উদাহরণ ১৩',k:'q',gist:'রম্বসের অপর কর্ণ ও পরিসীমা',
 q:'একটি রম্বসের একটি কর্ণ 10 মিটার এবং ক্ষেত্রফল 120 বর্গমিটার হলে অপর কর্ণ এবং পরিসীমা নির্ণয় কর।',
 f:['রম্বসের ক্ষেত্রফল = ½ d₁d₂','কর্ণদ্বয় সমকোণে সমদ্বিখণ্ডিত হয়'],
 idea:'ক্ষেত্রফল থেকে অপর কর্ণ। এরপর কর্ণের অর্ধেকগুলো নিয়ে সমকোণী ত্রিভুজ গড়ে বাহু, তারপর বাহু × 4।',
 dia:()=>D.rhombus({dh:24,dv:10,L:{dh:'AC = 24',dv:'BD = 10',s:'AD = ?',oa:'12',od:'5'}}),
 steps:[['অপর কর্ণ','½ × 10 × d₂ = 120 ⟹ d₂ = 24 মি.'],
  ['অর্ধ কর্ণ','OD = 10/2 = 5, OA = 24/2 = 12'],
  ['বাহু (সমকোণী △AOD)','AD² = 12² + 5² = 144 + 25 = 169<br>⟹ AD = 13 মি.'],
  ['পরিসীমা','4 × 13 = 52 মিটার']],
 tip:'5, 12, 13 একটি পরিচিত পিথাগোরীয় ত্রয়ী। চিনে ফেললে বর্গমূল বের করতে হয় না।',
 ans:[{l:'অপর কর্ণ',v:24,u:'মিটার'},{l:'পরিসীমা',v:52,u:'মিটার'}],fin:'অপর কর্ণ 24 মিটার, পরিসীমা 52 মিটার'},

{id:'ex14',sec:'ex1',no:'উদাহরণ ১৪',k:'q',gist:'ট্রাপিজিয়ামের ক্ষেত্রফল (চার বাহু দেওয়া)',
 q:'একটি ট্রাপিজিয়ামের সমান্তরাল বাহুদ্বয়ের দৈর্ঘ্য যথাক্রমে 91 সে.মি. ও 51 সে.মি. এবং অপর বাহু দুইটির দৈর্ঘ্য যথাক্রমে 37 সে.মি. ও 13 সে.মি.। ট্রাপিজিয়ামটির ক্ষেত্রফল নির্ণয় কর।',
 f:['ট্রাপিজিয়াম = ½(a + b) × h'],
 idea:'উচ্চতা h জানা নেই। দুই মাথা থেকে লম্ব নামালে দুটি সমকোণী ত্রিভুজ হয়। দুটোতে পিথাগোরাস লিখে x ও h বের করি।',
 dia:()=>D.trapezoid({u:[12,102,70],L:{ab:'AB = 91',cd:'CD = 51',ad:'13',bc:'37',h:'h',ae:'x',ef:'51',fb:'40 − x'}}),
 steps:[['লম্ব টানি','DE ও CF লম্ব। CDEF আয়তক্ষেত্র, তাই EF = 51।<br>AE = x ধরলে BF = 91 − (x + 51) = 40 − x'],
  ['△ADE','x² + h² = 13² = 169 …(1)'],
  ['△BCF','(40 − x)² + h² = 37²<br>1600 − 80x + (x² + h²) = 1369'],
  ['(1) বসাই','1600 − 80x + 169 = 1369 ⟹ 80x = 400 ⟹ x = 5'],
  ['উচ্চতা','5² + h² = 169 ⟹ h² = 144 ⟹ h = 12'],
  ['ক্ষেত্রফল',`${fr('1','2')}(91 + 51) × 12 = 71 × 12 = 852`]],
 chk:'যাচাই: BF = 35, 35² + 12² = 1225 + 144 = 1369 = 37² ✓',
 ans:[{l:'ক্ষেত্রফল',v:852,u:'বর্গ সে.মি.'}],fin:'ক্ষেত্রফল 852 বর্গ সে.মি.'},

{id:'ex21',sec:'ex2',no:'উদাহরণ ২১',k:'c',gist:'বৃত্তাকার মাঠের চারপাশে রাস্তা',
 q:'একটি বৃত্তাকার মাঠের ব্যাস 124 মিটার। মাঠের সীমানা ঘেঁষে 6 মিটার চওড়া একটি রাস্তা আছে। রাস্তার ক্ষেত্রফল নির্ণয় কর।',
 f:['রাস্তার ক্ষেত্রফল = π(R² − r²)','R = r + রাস্তার প্রস্থ'],
 idea:'রাস্তাসহ বড় বৃত্ত থেকে মাঠের ছোট বৃত্ত বাদ দিলে রাস্তা থাকে।',
 dia:()=>D.circle_ring({L:{r:'r = 62',w:'6 মি.',R:'রাস্তাসহ R = 62 + 6 = 68'},in:'মাঠ',ring:'রাস্তা'}),
 steps:[['ব্যাসার্ধ','r = 124/2 = 62 মি.<br>R = 62 + 6 = 68 মি.'],
  ['সূত্র',`π(R² − r²) = ${PI}(68² − 62²)`],
  ['বর্গের পার্থক্য','68² − 62² = 4624 − 3844 = 780<br>(দ্রুত: (68−62)(68+62) = 6 × 130 = 780)'],
  ['উত্তর',`${PI} × 780 = 2450.44`]],
 ans:[{l:'রাস্তার ক্ষেত্রফল',v:2450.44,u:'বর্গমিটার'}],fin:'রাস্তার ক্ষেত্রফল ≈ 2450.44 বর্গমিটার'},

{id:'ex22',sec:'ex2',no:'উদাহরণ ২২',k:'c',gist:'চাপ থেকে কেন্দ্রস্থ কোণ',
 q:'একটি বৃত্তের ব্যাসার্ধ 12 সে.মি. এবং বৃত্তচাপের দৈর্ঘ্য 14 সে.মি.। বৃত্তচাপটি কেন্দ্রে যে কোণ উৎপন্ন করে তা নির্ণয় কর।',
 f:[`চাপ s = ${fr('πrθ','180')}`],
 idea:'চাপের সূত্রে θ ছাড়া সবই জানা। সূত্রটাকে উল্টিয়ে θ এর জন্য সাজালেই কাজ শেষ।',

{id:'ex31',sec:'ex2',no:'উদাহরণ ৩১',k:'s',gist:'ঢাকনাসহ বাক্স: আয়তন, পুরুত্ব, রম্বস',
 q:'ঢাকনাসহ একটি বাক্সের বাইরের মাপ যথাক্রমে 10 সে.মি., 9 সে.মি. ও 7 সে.মি.। বাক্সটির ভিতরের সমগ্র পৃষ্ঠের ক্ষেত্রফল 262 বর্গ সে.মি. এবং বাক্সের পুরুত্ব সমান। ক) বাক্সটির আয়তন নির্ণয় কর। খ) বাক্সটির দেওয়ালের পুরুত্ব নির্ণয় কর। গ) বাক্সটির বৃহত্তম দৈর্ঘ্যের সমান বাহুবিশিষ্ট কোনো রম্বসের একটি কর্ণ 16 সে.মি. হলে রম্বসটির ক্ষেত্রফল নির্ণয় কর।',
 f:['ভিতরের মাপ = বাইরের মাপ − 2x','রম্বস = ½ d₁d₂'],
 idea:'দেওয়াল বাক্সের দুই পাশেই থাকে, তাই প্রতিটি মাপ থেকে 2x বাদ যায়। এই ভিতরের মাপ দিয়েই 262 এর সমীকরণ।',
 dia:()=>[['বাক্স',D.cuboid({L:{a:'10',b:'9',c:'7'},n:'বাইরের মাপ'})],['রম্বস (গ)',D.rhombus({dh:16,dv:12,L:{dh:'16',dv:'?',s:'10',oa:'8',od:'6'}})]],
 steps:[['ক) আয়তন','বাইরের আয়তন = 10 × 9 × 7 = 630 ঘন সে.মি.'],
  ['খ) ভিতরের মাপ','পুরুত্ব x হলে মাপ: (10−2x), (9−2x), (7−2x)'],
  ['খ) সমীকরণ','2(ab + bc + ca) = 262 ⟹ ab + bc + ca = 131<br>(90 − 38x + 4x²) + (63 − 32x + 4x²) + (70 − 34x + 4x²) = 131<br>12x² − 104x + 223 = 131 ⟹ 12x² − 104x + 92 = 0 ⟹ 3x² − 26x + 23 = 0'],
  ['খ) উৎপাদকে ভাঙি','3x² − 3x − 23x + 23 = 0 ⟹ (x − 1)(3x − 23) = 0<br>x = 1 অথবা x = 23/3 ≈ 7.67'],
  ['খ) গ্রহণযোগ্য মান','দেওয়াল দুই পাশে, তাই 2x < 7 অর্থাৎ x < 3.5। 7.67 হতে পারে না, তাই x = 1 সে.মি.'],
  ['গ) অপর কর্ণ','বাহু = 10, অর্ধ কর্ণ = 8<br>অপর অর্ধ কর্ণ = √(10² − 8²) = √36 = 6 ⟹ অপর কর্ণ = 12'],
  ['গ) ক্ষেত্রফল','½ × 16 × 12 = 96 বর্গ সে.মি.']],
 chk:'যাচাই (খ): ভিতরের মাপ 8, 7, 5 ⟹ 56 + 35 + 40 = 131, তল = 262 ✓',
 ans:[{l:'ক) আয়তন',v:630,u:'ঘন সে.মি.'},{l:'খ) পুরুত্ব',v:1,u:'সে.মি.'},{l:'গ) রম্বসের ক্ষেত্রফল',v:96,u:'বর্গ সে.মি.'}],
 fin:'ক) 630 ঘন সে.মি.  খ) 1 সে.মি.  গ) 96 বর্গ সে.মি.'},

{id:'p2-3',sec:'p2',no:'১৬.২ — ৩',k:'q',gist:'বাগানের ভিতরে সমান পাড়ের পুকুর',

 idea:'প্রতিটি বর্গ বিস্তার করলে a², b², c² দুবার করে আসে। অর্থাৎ রাশিটি = (a+b+c)² + (a² + b² + c²)।',
 dia:()=>D.area_abc({}),
 steps:[['বিস্তার করি','a² + 2ab + b² + b² + 2bc + c² + c² + 2ca + a²'],
  ['সাজাই','= (a² + b² + c² + 2ab + 2bc + 2ca) + (a² + b² + c²)'],
  ['সূত্র বসাই','= (a+b+c)² + {(a+b+c)² − 2(ab+bc+ca)}'],
  ['মান বসাই','= 2² + 2² − 2 × 1 = 4 + 4 − 2 = 6']],
 chk:'যাচাই: a² + b² + c² = 4 − 2 = 2, তাই 4 + 2 = 6 ✓',
 ans:[{l:'মান',v:6,u:''}],fin:'মান = 6'},

{id:'c3-ex15',sec:'c3e',no:'৩ — উদাহরণ ১৫',k:'a',gist:'x−y = 8, xy = 5 হলে x³ − y³ + 8(x+y)²',
 q:'যদি x − y = 8 এবং xy = 5 হয়, তবে x³ − y³ + 8(x + y)² এর মান কত?',
 f:['x³ − y³ = (x−y)³ + 3xy(x−y)','(x+y)² = (x−y)² + 4xy'],
 idea:'x ও y আলাদা করে বের করার দরকার নেই। দুটি সূত্র দিয়ে (x−y) আর xy এর মাধ্যমেই সব বের হয়।',
 dia:()=>D.chain({t:['x − y = 8,  xy = 5',{s:'x³ − y³ = (x−y)³ + 3xy(x−y)',k:'o'},{s:'(x+y)² = (x−y)² + 4xy',k:'o'},{s:'x³ − y³ + 8(x+y)²',k:'g'}],ar:['ঘন সূত্র','বর্গ সূত্র','যোগ']}),
 steps:[['ঘনের অন্তর','x³ − y³ = 8³ + 3×5×8 = 512 + 120 = 632'],['(x+y)²','= 8² + 4×5 = 64 + 20 = 84'],['8(x+y)²','8 × 84 = 672'],['যোগফল','632 + 672 = 1304']],
 chk:'বইয়ের পথ: 8(8² + 15 + 84) = 8 × 163 = 1304 ✓',
 ans:[{l:'মান',v:1304,u:''}],fin:'মান = 1304'},

{id:'c3-ex16',sec:'c3e',no:'৩ — উদাহরণ ১৬',k:'a',gist:'a = √3 + √2 হলে a³ + 1/a³ = 18√3',
 q:'যদি a = √3 + √2 হয়, তবে প্রমাণ কর যে, a³ + 1/a³ = 18√3',
 f:['a³ + 1/a³ = (a + 1/a)³ − 3(a + 1/a)','লব-হরকে অনুবন্ধী দিয়ে গুণ করে মূলদ করা যায়'],
 idea:'প্রথমে 1/a মূলদ করি। এতে a + 1/a খুব সহজ হয়। তারপর ঘনের সূত্র। নিজে করার ঘরে দশমিক মান দাও (√3 ≈ 1.7321)।',
 dia:()=>D.chain({t:['a = √3 + √2',{s:'1/a = 1/(√3+√2) = √3 − √2',k:'o'},{s:'a + 1/a = 2√3',k:'o'},{s:'(2√3)³ − 3(2√3) = 18√3',k:'g'}],ar:['অনুবন্ধী দিয়ে গুণ','যোগ','ঘনের সূত্র']}),
 steps:[['1/a বের করি','1/a = (√3 − √2) / {(√3+√2)(√3−√2)} = (√3 − √2)/(3 − 2) = √3 − √2'],['a + 1/a','(√3 + √2) + (√3 − √2) = 2√3'],
  ['ঘনের সূত্র','a³ + 1/a³ = (a + 1/a)³ − 3·a·(1/a)(a + 1/a) = (2√3)³ − 3(2√3)'],['সরল করি','= 8 × 3√3 − 6√3 = 24√3 − 6√3 = 18√3 (প্রমাণিত)']],
 ans:[{l:'a + 1/a (দশমিকে)',v:3.4641,u:'',t:.002},{l:'a³ + 1/a³ (দশমিকে)',v:31.1769,u:'',t:.02}],fin:'a³ + 1/a³ = 18√3 ≈ 31.18 (প্রমাণিত)'},

{id:'c3-ex17',sec:'c3e',no:'৩ — উদাহরণ ১৭',k:'a',gist:'x + y = 5, xy = 6, x > y: তিনটি মান',
 q:'x + y = 5, xy = 6 এবং x > y হলে ক) 2(x² + y²) এর মান নির্ণয় কর। খ) x³ − y³ − 3(x² + y²) এর মান নির্ণয় কর। গ) x⁵ + y⁵ এর মান নির্ণয় কর।',
 f:['x² + y² = (x+y)² − 2xy','x − y = √{(x+y)² − 4xy}','x³ − y³ = (x−y)³ + 3xy(x−y)'],
 idea:'আগে x² + y², তারপর x − y। শর্ত x > y থাকায় x − y ধনাত্মক। শেষে x = 3, y = 2 পাওয়া যায়।',
 dia:()=>D.chain({t:['x + y = 5,  xy = 6,  x > y',{s:'x² + y² = 25 − 12 = 13',k:'o'},{s:'x − y = √(25 − 24) = 1',k:'o'},{s:'x = 3,  y = 2',k:'g'}],ar:['(x+y)² − 2xy','(x+y)² − 4xy','যোগ ও বিয়োগ']}),
 steps:[['ক) x² + y²','2(x² + y²) = 2{(x+y)² − 2xy} = 2(25 − 12) = 26'],['খ) x − y','√(5² − 4×6) = √1 = 1 (x > y বলে ধনাত্মক)'],
  ['খ) মান','x³ − y³ − 3(x² + y²) = (x−y)³ + 3xy(x−y) − (3/2)·2(x²+y²)<br>= 1 + 18 − (3/2)×26 = 19 − 39 = −20'],['গ) x, y','x + y = 5, x − y = 1 ⟹ x = 3, y = 2'],['গ) মান','x⁵ + y⁵ = 3⁵ + 2⁵ = 243 + 32 = 275']],
 note:'বইয়ে (খ) এর উত্তর "−20 অথবা −58" লেখা। কিন্তু শর্ত x > y, তাই x − y = −1 হতে পারে না। একমাত্র উত্তর −20। যাচাই: x = 3, y = 2 হলে 27 − 8 − 3×13 = −20।',
 ans:[{l:'ক) 2(x² + y²)',v:26,u:''},{l:'খ) x³ − y³ − 3(x² + y²)',v:-20,u:''},{l:'গ) x⁵ + y⁵',v:275,u:''}],fin:'ক) 26   খ) −20   গ) 275'},

{id:'c3-ex34',sec:'c3e',no:'৩ — উদাহরণ ৩৪',k:'a',gist:'৫ জন চাঁদা দিল না, সদস্য সংখ্যা কত',
 q:'বার্ষিক ক্রীড়া অনুষ্ঠান করার জন্য কোনো এক সমিতির সদস্যরা 45,000 টাকার বাজেট করলেন এবং সিদ্ধান্ত নিলেন যে, প্রত্যেক সদস্যই সমান চাঁদা দিবেন। কিন্তু 5 জন সদস্য চাঁদা দিতে অসম্মতি জানালেন। এর ফলে প্রত্যেক সদস্যের মাথাপিছু 15 টাকা চাঁদা বৃদ্ধি পেল। ঐ সমিতিতে কতজন সদস্য ছিলেন?',
 f:['মোট চাঁদা = সদস্য সংখ্যা × জনপ্রতি চাঁদা','দুই অবস্থাতেই মোট চাঁদা সমান'],
 idea:'ছবির আয়তক্ষেত্রের ক্ষেত্রফলই মোট চাঁদা। ডানের লাল অংশ (5 জন) কমলে বাকিদের উপরে সবুজ অংশ (15 টাকা) যোগ হয়। ক্ষেত্রফল একই থাকে।',
 dia:()=>D.area_swap({W:'সদস্য x জন',H:'q টাকা',rm:'5 জন',ad:'জনপ্রতি +15 টাকা',cap:'লাল ও সবুজ অংশের ক্ষেত্রফল সমান'}),
 steps:[['সমীকরণ','qx = 45000 …(2)<br>qx = (x − 5)(q + 15) …(1)'],['(1) সরল করি','qx = qx − 5q + 15x − 75 ⟹ 5q = 15x − 75 ⟹ q = 3x − 15'],
  ['(2) এ বসাই','(3x − 15)x = 45000 ⟹ x² − 5x = 15000 ⟹ x² − 5x − 15000 = 0'],['উৎপাদকে ভাঙি','x² − 125x + 120x − 15000 = 0 ⟹ (x − 125)(x + 120) = 0'],['গ্রহণযোগ্য মান','x = 125 অথবা −120। সদস্য সংখ্যা ঋণাত্মক হয় না, তাই x = 125']],
 chk:'যাচাই: q = 3×125 − 15 = 360, 125 × 360 = 45000। আবার 120 × 375 = 45000 ✓',
 ans:[{l:'সদস্য সংখ্যা',v:125,u:'জন'}],fin:'সমিতিতে 125 জন সদস্য ছিলেন'},

{id:'c3-ex36',sec:'c3e',no:'৩ — উদাহরণ ৩৬',k:'a',self:1,gist:'স্রোতের বেগ ও নৌকার বেগ (সূত্র)',
 q:'একজন মাঝি স্রোতের প্রতিকূলে t₁ ঘণ্টায় x কি.মি. যেতে পারে। স্রোতের অনুকূলে ঐ পথ যেতে তার t₂ ঘণ্টা লাগে। স্রোতের বেগ ও নৌকার বেগ কত?',
 f:['বেগ = দূরত্ব ÷ সময়','অনুকূলে বেগ = u + v','প্রতিকূলে বেগ = u − v'],
 idea:'অনুকূলে স্রোত নৌকাকে সাহায্য করে, প্রতিকূলে বাধা দেয়। দুই বেগের যোগ করলে v কাটা যায়, বিয়োগ করলে u কাটা যায়। উত্তর সূত্র আকারে হবে, তাই নিজে করে মিলিয়ে নাও।',
 dia:()=>D.river({l1:'অনুকূলে: u + v = x/t₂',l2:'প্রতিকূলে: u − v = x/t₁'}),
 steps:[['অজানা','স্রোতের বেগ v, স্থির পানিতে নৌকার বেগ u (কি.মি./ঘণ্টা)'],['সমীকরণ জোট','u + v = x/t₂ …(1)<br>u − v = x/t₁ …(2)'],
  ['যোগ করি','2u = x/t₂ + x/t₁ ⟹ u = (x/2)(1/t₁ + 1/t₂)'],['বিয়োগ করি','2v = x/t₂ − x/t₁ ⟹ v = (x/2)(1/t₂ − 1/t₁)']],
 chk:'সংখ্যায় যাচাই: x = 24, t₁ = 4, t₂ = 2 হলে u = 12(1/4 + 1/2) = 9, v = 12(1/2 − 1/4) = 3। তখন 9 + 3 = 12 = 24/2 ✓ এবং 9 − 3 = 6 = 24/4 ✓',
 ans:[],fin:'নৌকার বেগ (x/2)(1/t₁ + 1/t₂), স্রোতের বেগ (x/2)(1/t₂ − 1/t₁) কি.মি./ঘণ্টা'},

{id:'c3-ex37',sec:'c3e',no:'৩ — উদাহরণ ৩৭',k:'a',gist:'চৌবাচ্চা ও দুটি নল',
 q:'একটি নল 12 মিনিটে একটি খালি চৌবাচ্চা পূর্ণ করতে পারে। অপর একটি নল প্রতি মিনিটে 14 লিটার পানি বের করে দেয়। চৌবাচ্চাটি খালি থাকা অবস্থায় দুইটি নল একসাথে খুলে দেওয়া হলে চৌবাচ্চাটি 96 মিনিটে পূর্ণ হয়। চৌবাচ্চাতে কত লিটার পানি ধরে?',
 f:['ধারণক্ষমতা = প্রতি মিনিটের পরিমাণ × সময়','দুই নল একসাথে: ঢোকা − বেরোনো'],
 idea:'প্রথম নলের প্রতি মিনিটের পরিমাণ x, চৌবাচ্চা y লিটার। একা চললে y = 12x। দুটি একসাথে 96 মিনিটে 96x ঢোকে ও 96 × 14 বেরোয়।',
 dia:()=>D.tank({in:'x লিটার/মিনিট',out:'14 লিটার/মিনিট',mid:'ধারণক্ষমতা y'}),
 steps:[['সমীকরণ','y = 12x …(1)<br>y = 96x − 96 × 14 …(2)'],['x বসাই','(1) থেকে x = y/12'],['(2) এ বসাই','y = 96 × y/12 − 96 × 14 = 8y − 1344'],['y বের করি','7y = 1344 ⟹ y = 192']],
 chk:'যাচাই: x = 192/12 = 16। 96 মিনিটে 96 × 16 − 96 × 14 = 192 ✓',
 ans:[{l:'ধারণক্ষমতা',v:192,u:'লিটার'}],fin:'চৌবাচ্চায় 192 লিটার পানি ধরে'},

{id:'c3-ex41',sec:'c3e',no:'৩ — উদাহরণ ৪১',k:'a',gist:'চক্রবৃদ্ধি মুনাফা: 15000 টাকা, 6%, 3 বছর',
 q:'বার্ষিক শতকরা 6 টাকা হার চক্রবৃদ্ধি মুনাফায় 15000 টাকার 3 বছরের সবৃদ্ধিমূল ও চক্রবৃদ্ধি মুনাফা নির্ণয় কর।',
 f:['সবৃদ্ধিমূল C = P(1 + r)ⁿ','চক্রবৃদ্ধি মুনাফা = C − P'],
 idea:'প্রতি বছর আগের বছরের মোট টাকার উপর মুনাফা যোগ হয়। তাই প্রতি বছর টাকাকে (1 + r) গুণ করা হয়। তিন বছরে তিনবার।',
 dia:()=>D.bars({v:[{v:15000,t:'15000',l:'শুরু'},{v:15900,t:'15900',l:'১ বছর',k:'o'},{v:16854,t:'16854',l:'২ বছর',k:'o'},{v:17865.24,t:'17865.24',l:'৩ বছর',k:'g'}],n:'প্রতি বছর ×1.06'}),
 steps:[['মান','P = 15000, r = 6/100 = 3/50, n = 3'],['সূত্র','C = 15000(1 + 3/50)³ = 15000 × (53/50)³'],['হিসাব','= 15000 × 148877/125000 = 446631/25 = 17865.24'],['মুনাফা','17865.24 − 15000 = 2865.24']],
 chk:'বছর ধরে যাচাই: 15000 → 15900 → 16854 → 17865.24 ✓',
 ans:[{l:'সবৃদ্ধিমূল',v:17865.24,u:'টাকা'},{l:'চক্রবৃদ্ধি মুনাফা',v:2865.24,u:'টাকা'}],fin:'সবৃদ্ধিমূল 17865.24 টাকা, মুনাফা 2865.24 টাকা'},

{id:'c3-ex42',sec:'c3e',no:'৩ — উদাহরণ ৪২',k:'a',self:1,gist:'আইসক্রিম: ক্ষতি থেকে লাভ (সূত্র)',
 q:'টাকায় 10 টি আইসক্রিম বিক্রয় করলে x% ক্ষতি হয়। টাকায় কয়টি বিক্রয় করলে z% লাভ হবে?',
 f:['ক্ষতিতে বিক্রয়মূল্য = ক্রয়মূল্য × (100 − x)/100','লাভে বিক্রয়মূল্য = ক্রয়মূল্য × (100 + z)/100'],
 idea:'আগে ক্ষতির তথ্য থেকে ক্রয়মূল্য বের করি, তারপর লাভের তথ্যে বিক্রয়মূল্য। শেষে 1 টির দাম উল্টিয়ে টাকায় কয়টি পাওয়া যায় লিখি।',
 dia:()=>D.chain({t:['টাকায় 10 টি, x% ক্ষতি',{s:'10 টির ক্রয়মূল্য = 100/(100 − x) টাকা',k:'o'},{s:'1 টির ক্রয়মূল্য = 100/{10(100 − x)}',k:'o'},{s:'z% লাভে 1 টির বিক্রয়মূল্য = (100+z)/(1000−10x)',k:'g'}],ar:['100 টাকা ক্রয় ⟹ (100−x) বিক্রয়','10 দিয়ে ভাগ','× (100+z)/100']}),
 steps:[['ক্রয়মূল্য','বিক্রয়মূল্য (100 − x) হলে ক্রয়মূল্য 100<br>বিক্রয়মূল্য 1 টাকা হলে ক্রয়মূল্য 100/(100 − x)'],['1 টি আইসক্রিম','10 টির ক্রয়মূল্য 100/(100−x) ⟹ 1 টির ক্রয়মূল্য 100/{10(100−x)}'],
  ['z% লাভে','ক্রয়মূল্য 1 হলে বিক্রয়মূল্য (100+z)/100<br>1 টির বিক্রয়মূল্য = (100+z)/{10(100−x)} = (100+z)/(1000−10x)'],['টাকায় কয়টি','(1000 − 10x)/(100 + z) টি']],
 chk:'সংখ্যায় যাচাই: x = 10, z = 20 হলে (1000 − 100)/120 = 7.5 টি',
 ans:[],fin:'টাকায় (1000 − 10x)/(100 + z) টি আইসক্রিম বিক্রয় করতে হবে'},

{id:'c3-p7',sec:'c3x',no:'৩.১ — ৭',k:'a',gist:'a + 1/a = 2 হলে a² + 1/a² = a⁴ + 1/a⁴',
 q:'a + 1/a = 2 হলে, দেখাও যে, a² + 1/a² = a⁴ + 1/a⁴',
 f:['(a + 1/a)² = a² + 2 + 1/a²','(a² + 1/a²)² = a⁴ + 2 + 1/a⁴'],
 idea:'একবার বর্গ করলে a² + 1/a² পাই। সেটিকে আবার বর্গ করলে a⁴ + 1/a⁴। প্রতিবার মাঝের 2 বাদ যায়।',
 dia:()=>D.chain({t:['a + 1/a = 2',{s:'a² + 2 + 1/a² = 4',k:'o'},{s:'a² + 1/a² = 2',k:'g'},{s:'a⁴ + 2 + 1/a⁴ = 4',k:'o'},{s:'a⁴ + 1/a⁴ = 2',k:'g'}],ar:['বর্গ','− 2','বর্গ','− 2']}),
 steps:[['প্রথম বর্গ','(a + 1/a)² = a² + 2 + 1/a² = 4 ⟹ a² + 1/a² = 2'],['দ্বিতীয় বর্গ','(a² + 1/a²)² = a⁴ + 2 + 1/a⁴ = 4 ⟹ a⁴ + 1/a⁴ = 2'],['তুলনা','দুটিই 2, তাই সমান (দেখানো হলো)']],
 tip:'a + 1/a = 2 থেকে (a − 1)² = 0, অর্থাৎ a = 1। a = 1 বসালেও দুই পক্ষ 2 আসে।',
 ans:[{l:'a² + 1/a²',v:2,u:''},{l:'a⁴ + 1/a⁴',v:2,u:''}],fin:'দুটিই 2, তাই a² + 1/a² = a⁴ + 1/a⁴ (দেখানো হলো)'},

{id:'c3-p8',sec:'c3x',no:'৩.১ — ৮',k:'a',gist:'a+b = √7, a−b = √5 হলে 8ab(a²+b²) = 24',
 q:'a + b = √7 এবং a − b = √5 হলে, প্রমাণ কর যে, 8ab(a² + b²) = 24',
 f:['8ab(a² + b²) = (a+b)⁴ − (a−b)⁴ (উদাহরণ ৮)'],
 idea:'উদাহরণ ৮ এর ফলাফল সরাসরি কাজে লাগে। (√7)⁴ = 49 এবং (√5)⁴ = 25।',
 dia:()=>D.area_diff({}),
 steps:[['উদাহরণ ৮ থেকে','8ab(a² + b²) = (a+b)⁴ − (a−b)⁴'],['মান বসাই','(√7)⁴ = 49, (√5)⁴ = 25'],['বিয়োগ','49 − 25 = 24 (প্রমাণিত)'],
  ['বিকল্প (লম্বা পথ)','4ab = (a+b)² − (a−b)² = 7 − 5 = 2 ⟹ ab = 1/2<br>2(a²+b²) = 7 + 5 = 12 ⟹ a² + b² = 6<br>8 × 1/2 × 6 = 24 ✓']],
 ans:[{l:'8ab(a² + b²) এর মান',v:24,u:''}],fin:'8ab(a² + b²) = 24 (প্রমাণিত)'},

{id:'c3-p9',sec:'c3x',no:'৩.১ — ৯',k:'a',gist:'a+b+c = 9, ab+bc+ca = 31 হলে a²+b²+c²',
 q:'a + b + c = 9 এবং ab + bc + ca = 31 হলে, a² + b² + c² এর মান নির্ণয় কর।',

 idea:'ছবির 3×3 গ্রিডে কোণাকুণি তিনটি বর্গ আর বাকি ছয়টি আয়ত। পুরো বর্গ থেকে ছয়টি আয়ত বাদ দিলেই বর্গ তিনটি।',
 dia:()=>D.area_abc({}),
 steps:[['সূত্র','(a+b+c)² = a² + b² + c² + 2(ab+bc+ca)'],['মান বসাই','81 = a² + b² + c² + 62'],['উত্তর','a² + b² + c² = 81 − 62 = 19']],

{id:'c3-p10',sec:'c3x',no:'৩.১ — ১০',k:'a',gist:'a²+b²+c² = 9, ab+bc+ca = 8 হলে (a+b+c)²',
 q:'a² + b² + c² = 9 এবং ab + bc + ca = 8 হলে, (a + b + c)² এর মান কত?',
 f:['(a+b+c)² = a² + b² + c² + 2(ab + bc + ca)'],
 idea:'এবার সূত্রটি সরাসরি বসাতে হয়। কোনো অজানা সরানোর দরকার নেই।',
 dia:()=>D.area_abc({}),
 steps:[['সূত্র','(a+b+c)² = a² + b² + c² + 2(ab+bc+ca)'],['বসাই','= 9 + 2 × 8 = 9 + 16'],['উত্তর','= 25']],

{id:'c3-p11',sec:'c3x',no:'৩.১ — ১১',k:'a',gist:'(a−b)² + (b−c)² + (c−a)² এর মান',
 q:'a + b + c = 6 এবং a² + b² + c² = 14 হলে, (a − b)² + (b − c)² + (c − a)² = কত?',
 f:['(a+b+c)² = a² + b² + c² + 2(ab+bc+ca)','(a−b)² + (b−c)² + (c−a)² = 2(a²+b²+c²) − 2(ab+bc+ca)'],
 idea:'আগে ab + bc + ca বের করি। তারপর অন্তরের বর্গ তিনটি বিস্তার করলে a², b², c² দুবার করে আর ab, bc, ca ঋণাত্মক চিহ্নে আসে।',
 dia:()=>D.chain({t:['a + b + c = 6,  a² + b² + c² = 14',{s:'36 = 14 + 2(ab + bc + ca) ⟹ ab+bc+ca = 11',k:'o'},{s:'2 × 14 − 2 × 11 = 6',k:'g'}],ar:['(a+b+c)² সূত্র','বিস্তার']}),
 steps:[['ab + bc + ca','36 = 14 + 2(ab + bc + ca) ⟹ ab + bc + ca = 11'],['বিস্তার','(a−b)² + (b−c)² + (c−a)² = 2(a²+b²+c²) − 2(ab+bc+ca)'],['মান','= 2 × 14 − 2 × 11 = 28 − 22 = 6']],
 ans:[{l:'ab + bc + ca',v:11,u:''},{l:'চূড়ান্ত মান',v:6,u:''}],fin:'মান = 6'},

{id:'c3-p12',sec:'c3x',no:'৩.১ — ১২',k:'a',gist:'9x²+16y²+4z²−24xy−16yz+12zx, x=3, y=4, z=5',
 q:'x = 3, y = 4 এবং z = 5 হলে, 9x² + 16y² + 4z² − 24xy − 16yz + 12zx = কত?',
 f:['(p + q + r)² = p² + q² + r² + 2pq + 2qr + 2rp'],
 idea:'9x² = (3x)², 16y² = (4y)², 4z² = (2z)²। মাঝের পদগুলো −2(3x)(4y), −2(4y)(2z), +2(3x)(2z)। অর্থাৎ রাশিটি একটি পূর্ণবর্গ।',
 dia:()=>D.chain({t:['9x² + 16y² + 4z² − 24xy − 16yz + 12zx',{s:'= (3x)² + (4y)² + (2z)² − 2(3x)(4y) − 2(4y)(2z) + 2(3x)(2z)',k:'o'},{s:'= (3x − 4y + 2z)²',k:'g'},{s:'x=3, y=4, z=5 ⟹ (9 − 16 + 10)² = 3² = 9',k:'g'}],ar:['পদ চিনি','পূর্ণবর্গ','মান বসাই']}),
 steps:[['পূর্ণবর্গ খুঁজি','−24xy = −2(3x)(4y), −16yz = −2(4y)(2z), 12zx = 2(3x)(2z)'],['সংক্ষেপে','রাশি = (3x − 4y + 2z)²'],['মান বসাই','3x − 4y + 2z = 9 − 16 + 10 = 3 ⟹ 3² = 9']],
 chk:'সরাসরি বসিয়ে: 81 + 256 + 100 − 288 − 320 + 180 = 437 − 428 = 9 ✓',
 ans:[{l:'মান',v:9,u:''}],fin:'মান = 9'},

{id:'c5-ex6',sec:'c5e',no:'৫ — উদাহরণ ৬',k:'e',gist:'বেঞ্চে ছাত্র বসানো, ছাত্র সংখ্যা',
 q:'একটি শ্রেণির প্রতিবেঞ্চে 4 জন করে ছাত্র বসালে 3 টি বেঞ্চ খালি থাকে। আবার, প্রতিবেঞ্চে 3 জন করে ছাত্র বসালে 6 জন ছাত্রকে দাঁড়িয়ে থাকতে হয়। ঐ শ্রেণির ছাত্র সংখ্যা কত?',
 f:['বেঞ্চ সংখ্যা দুই ক্ষেত্রেই সমান'],
 idea:'ছাত্র সংখ্যা x ধরলে প্রথম ক্ষেত্রে বেঞ্চ = x/4 + 3 (ব্যবহৃত + খালি)। দ্বিতীয় ক্ষেত্রে বসেছে x − 6 জন, বেঞ্চ = (x − 6)/3। দুটি সমান।',
 dia:()=>D.benches({b:6,per1:4,e:3,per2:3,s:6}),
 steps:[['বেঞ্চ সংখ্যা','1ম ক্ষেত্রে x/4 + 3, 2য় ক্ষেত্রে (x − 6)/3'],['সমীকরণ','x/4 + 3 = (x − 6)/3 ⟹ (x + 12)/4 = (x − 6)/3'],['আড়গুণন','3x + 36 = 4x − 24'],['সমাধান','x = 60']],
 chk:'যাচাই: বেঞ্চ = 60/4 + 3 = 18 এবং (60 − 6)/3 = 18 ✓',
 ans:[{l:'ছাত্র সংখ্যা',v:60,u:'জন'}],fin:'ছাত্র সংখ্যা 60'},

{id:'c5-ex7',sec:'c5e',no:'৫ — উদাহরণ ৭',k:'e',gist:'দুই হারে বিনিয়োগ, মোট মুনাফা 6400',
 q:'কবির সাহেব তাঁর 56000 টাকার কিছু টাকা বার্ষিক 12% মুনাফায় ও বাকি টাকা বার্ষিক 10% মুনাফায় বিনিয়োগ করলেন। এক বছর পর তিনি মোট 6400 টাকা মুনাফা পেলেন। তিনি 12% মুনাফায় কত টাকা বিনিয়োগ করেছেন?',
 f:['এক বছরের মুনাফা = টাকা × হার/100'],
 idea:'12% এ x টাকা ধরলে 10% এ (56000 − x)। দুই অংশের মুনাফার যোগফল 6400।',
 dia:()=>D.hbars({rows:[{l:'মোট 56000 টাকা',seg:[{w:1,t:'x টাকা (12%)',k:'o'},{w:1,t:'(56000−x) টাকা (10%)',k:'g'}]},{l:'এক বছরের মুনাফা',seg:[{w:1,t:'12x/100',k:'o'},{w:1,t:'10(56000−x)/100',k:'g'}],end:'মোট 6400'}]}),
 steps:[['সমীকরণ','12x/100 + 10(56000 − x)/100 = 6400'],['100 দিয়ে গুণ','12x + 560000 − 10x = 640000'],['সরল','2x = 80000 ⟹ x = 40000']],
 chk:'যাচাই: 40000 এর 12% = 4800, 16000 এর 10% = 1600, যোগফল 6400 ✓',
 ans:[{l:'12% এ বিনিয়োগ',v:40000,u:'টাকা'}],fin:'12% মুনাফায় 40000 টাকা'},

{id:'c5-ex11',sec:'c5e',no:'৫ — উদাহরণ ১১',k:'e',gist:'((x+a)/(x−a))² − 5(x+a)/(x−a) + 6 = 0',
 q:'সমাধান কর: ((x + a)/(x − a))² − 5((x + a)/(x − a)) + 6 = 0',
 f:['বড় রাশিকে একটি অক্ষর ধরে সরল করা (প্রতিস্থাপন)','মধ্যপদ বিভাজনে উৎপাদক'],
 idea:'(x+a)/(x−a) কে y ধরলে সমীকরণটি y² − 5y + 6 = 0 হয়ে যায়। y পেলে আবার x এ ফিরি। নিজে যাচাইয়ে a = 1 ধরে x এর দুটি মান লেখো।',
 dia:()=>D.chain({t:['ধরি y = (x + a)/(x − a)',{s:'y² − 5y + 6 = 0',k:'o'},{s:'(y − 2)(y − 3) = 0 ⟹ y = 2 অথবা 3',k:'o'},{s:'y = 2 ⟹ x = 3a;   y = 3 ⟹ x = 2a',k:'g'}],ar:['প্রতিস্থাপন','উৎপাদক','x এ ফিরি']}),
 steps:[['প্রতিস্থাপন','y = (x+a)/(x−a) ⟹ y² − 5y + 6 = 0'],['উৎপাদক','y² − 2y − 3y + 6 = 0 ⟹ (y − 2)(y − 3) = 0'],['y = 2','x + a = 2(x − a) ⟹ x = 3a'],['y = 3','x + a = 3(x − a) ⟹ 2x = 4a ⟹ x = 2a']],
 ans:[{l:'a = 1 হলে ছোট মান x',v:2,u:''},{l:'বড় মান x',v:3,u:''}],fin:'x = 2a অথবা x = 3a'},

{id:'c5-ex13',sec:'c5e',no:'৫ — উদাহরণ ১৩',k:'e',gist:'বাগানের ভিতরে রাস্তা কত চওড়া',
 q:'50 মিটার দৈর্ঘ্য এবং 40 মিটার প্রস্থবিশিষ্ট একটি আয়তাকার বাগানের ভিতরের চারদিকে সমান চওড়া একটি রাস্তা আছে। রাস্তা বাদে বাগানের ক্ষেত্রফল 1200 বর্গমিটার হলে, রাস্তাটি কত মিটার চওড়া?',
 f:['রাস্তা বাদে মাপ = পুরো মাপ − 2 × রাস্তার প্রস্থ'],
 idea:'রাস্তা চারদিকে, তাই দৈর্ঘ্য ও প্রস্থ দুটি থেকেই 2x বাদ যায়।',
 dia:()=>D.rect_in_rect({edge:'রাস্তা x',inner:'(50 − 2x) × (40 − 2x)',area:'= 1200 বর্গমি.',outer:'বাগান 50 × 40'}),
 steps:[['মাপ','রাস্তা বাদে দৈর্ঘ্য (50 − 2x), প্রস্থ (40 − 2x)'],['সমীকরণ','(50 − 2x)(40 − 2x) = 1200 ⟹ 4x² − 180x + 800 = 0'],['4 দিয়ে ভাগ','x² − 45x + 200 = 0 ⟹ (x − 5)(x − 40) = 0'],['গ্রহণযোগ্য মান','x = 5 অথবা 40। প্রস্থ 40 মিটারের কম চওড়া হতে হবে, তাই x = 5']],
 chk:'যাচাই: (50 − 10)(40 − 10) = 40 × 30 = 1200 ✓',
 ans:[{l:'রাস্তার প্রস্থ',v:5,u:'মিটার'}],fin:'রাস্তা 5 মিটার চওড়া'},

{id:'c5-ex14',sec:'c5e',no:'৫ — উদাহরণ ১৪',k:'e',gist:'240 টাকায় কলম, একটি বেশি হলে দাম 1 টাকা কম',
 q:'শাহিক 240 টাকায় কতগুলো কলম কিনল। সে যদি ঐ টাকায় একটি কলম বেশি পেতো তবে প্রতিটি কলমের দাম গড়ে 1 টাকা কম পড়তো। সে কতগুলো কলম কিনল?',
 f:['প্রতিটির দাম = মোট টাকা ÷ কলম সংখ্যা'],
 idea:'ছবির মতো: মোট টাকা (ক্ষেত্রফল) একই। কলম সংখ্যা বাড়লে দাম কমে।',
 dia:()=>D.area_swap({wide:1,W:'কলম x টি',H:'দাম 240/x',rm:'1 টাকা',ad:'1 টি কলম',cap:'মোট টাকা 240 একই'}),
 steps:[['সমীকরণ','240/(x+1) = 240/x − 1 = (240 − x)/x'],['আড়গুণন','240x = (x+1)(240 − x) = 240x + 240 − x² − x'],['সরল','x² + x − 240 = 0'],['উৎপাদক','x² + 16x − 15x − 240 = 0 ⟹ (x + 16)(x − 15) = 0'],['গ্রহণযোগ্য মান','x = 15 (−16 হতে পারে না)']],
 chk:'যাচাই: 240/15 = 16 টাকা, 240/16 = 15 টাকা, পার্থক্য 1 টাকা ✓',
 ans:[{l:'কলম',v:15,u:'টি'}],fin:'শাহিক 15 টি কলম কিনেছিল'},

{id:'c5-ex15',sec:'c5e',no:'৫ — উদাহরণ ১৫',k:'e',gist:'গড় নম্বর এক কমে গেল',
 q:'একটি বিদ্যালয়ের নবম শ্রেণির একটি পরীক্ষায় x জন ছাত্রের গণিতে প্রাপ্ত মোট নম্বর 1950। একই পরীক্ষায় অন্য একজন নতুন ছাত্রের গণিতে প্রাপ্ত নম্বর 34 যোগ করায় প্রাপ্ত নম্বরের গড় 1 কমে গেল। ক) পৃথকভাবে x জন ছাত্রের এবং নতুন ছাত্রসহ সকলের প্রাপ্ত নম্বরের গড় x এর মাধ্যমে লেখ। খ) প্রদত্ত শর্তানুসারে সমীকরণ গঠন করে দেখাও যে, x² + 35x − 1950 = 0 গ) x এর মান বের করে উভয় ক্ষেত্রে নম্বরের গড় কত তা নির্ণয় কর।',
 f:['গড় = মোট নম্বর ÷ ছাত্র সংখ্যা'],
 idea:'(ক) ও (খ) এ সমীকরণ গড়তে হয়, তাই লিখে দেখাও। নিজে করার ঘরে গ) এর তিনটি মান দাও।',
 dia:()=>D.chain({t:['ক) গড় = 1950/x   এবং   1984/(x+1)',{s:'খ) 1950/x − 1984/(x+1) = 1',k:'o'},{s:'x² + 35x − 1950 = 0',k:'o'},{s:'গ) x = 30,  গড় 65 ও 64',k:'g'}],ar:['গড় 1 কমেছে','আড়গুণন করে সরল','উৎপাদক']}),
 steps:[['ক) গড়','x জনের গড় = 1950/x<br>(x + 1) জনের গড় = (1950 + 34)/(x + 1) = 1984/(x + 1)'],['খ) সমীকরণ','1950/x = 1984/(x+1) + 1 ⟹ 1950/x − 1984/(x+1) = 1'],
  ['খ) সরল','(1950x + 1950 − 1984x)/(x(x+1)) = 1 ⟹ x² + x = 1950 − 34x ⟹ x² + 35x − 1950 = 0'],['গ) উৎপাদক','x² + 65x − 30x − 1950 = 0 ⟹ (x + 65)(x − 30) = 0 ⟹ x = 30'],['গ) গড়','প্রথমে 1950/30 = 65, পরে 1984/31 = 64']],
 ans:[{l:'x এর মান',v:30,u:'জন'},{l:'প্রথম গড়',v:65,u:'নম্বর'},{l:'দ্বিতীয় গড়',v:64,u:'নম্বর'}],fin:'x = 30, প্রথম গড় 65, দ্বিতীয় গড় 64'},

{id:'c5-p14',sec:'c51',no:'৫.১ — ১৪',k:'e',gist:'(2t−6)/9 + (15−2t)/(12−5t) = (4t−15)/18',
 q:'সমাধান সেট নির্ণয় কর: (2t − 6)/9 + (15 − 2t)/(12 − 5t) = (4t − 15)/18',
 f:['সমীকরণের এক পাশে ধ্রুব হরের ভগ্নাংশ, অন্য পাশে চলক হরের ভগ্নাংশ আনি'],
 idea:'(4t − 15)/18 বাম পাশে আনলে t এর অংশ কেটে একটি সংখ্যা বাকি থাকে। তখন সমীকরণ সহজ।',
 dia:()=>D.chain({t:['(2t−6)/9 − (4t−15)/18 = 1/6',{s:'1/6 = (2t − 15)/(12 − 5t)',k:'o'},{s:'12 − 5t = 12t − 90',k:'o'},{s:'17t = 102 ⟹ t = 6',k:'g'}],ar:['ডানে (15−2t)/(12−5t) আনি','আড়গুণন','পক্ষান্তর']}),
 steps:[['বাম পক্ষ','(2(2t−6) − (4t−15))/18 = (4t − 12 − 4t + 15)/18 = 3/18 = 1/6'],['ডান পক্ষ','−(15 − 2t)/(12 − 5t) = (2t − 15)/(12 − 5t)'],['আড়গুণন','12 − 5t = 6(2t − 15) = 12t − 90'],['সমাধান','102 = 17t ⟹ t = 6']],
 chk:'যাচাই: বাম = 6/9 + 3/(−18) = 2/3 − 1/6 = 1/2, ডান = 9/18 = 1/2 ✓',
 ans:[{l:'t এর মান',v:6,u:''}],fin:'সমাধান সেট S = {6}'},

{id:'c5-p19',sec:'c51',no:'৫.১ — ১৯',k:'e',gist:'5600 টাকা, 5% ও 4% লাভ, মোট 256',
 q:'একজন ক্ষুদ্র ব্যবসায়ী 5600 টাকা বিনিয়োগ করে এক বছর পর কিছু টাকার উপর 5% এবং অবশিষ্ট টাকার উপর 4% লাভ করলেন। মোট 256 টাকা লাভ করলে, তিনি কত টাকার উপর 5% লাভ করলেন?',
 f:['লাভ = টাকা × হার/100'],

 dia:()=>D.hbars({rows:[{l:'মোট 5600 টাকা',seg:[{w:1,t:'x টাকা (5%)',k:'o'},{w:1,t:'(5600−x) টাকা (4%)',k:'g'}]},{l:'এক বছরের লাভ',seg:[{w:1,t:'5x/100',k:'o'},{w:1,t:'4(5600−x)/100',k:'g'}],end:'মোট 256'}]}),
 steps:[['সমীকরণ','5x/100 + 4(5600 − x)/100 = 256'],['100 দিয়ে গুণ','5x + 22400 − 4x = 25600'],['সমাধান','x = 25600 − 22400 = 3200']],

 ans:[{l:'5% এ',v:3200,u:'টাকা'}],fin:'3200 টাকার উপর 5% লাভ'},

{id:'c5-p20',sec:'c51',no:'৫.১ — ২০',k:'e',gist:'বালিকা বিদ্যালয়ের বেঞ্চ সংখ্যা',
 q:'একটি বালিকা বিদ্যালয়ের একটি শ্রেণিকক্ষে প্রতিবেঞ্চে 6 জন করে ছাত্রী বসালে 2 টি বেঞ্চ খালি থাকে। কিন্তু প্রতি বেঞ্চে 5 জন করে ছাত্রী বসালে 6 জন ছাত্রীকে দাঁড়িয়ে থাকতে হয়। ঐ শ্রেণির বেঞ্চের সংখ্যা কয়টি?',
 f:['ছাত্রী সংখ্যা দুই ক্ষেত্রেই সমান'],
 idea:'এবার বেঞ্চ সংখ্যা b ধরলে সমীকরণ আরও সোজা। প্রথমে 6(b − 2) জন, পরে 5b + 6 জন।',
 dia:()=>D.benches({b:6,per1:6,e:2,per2:5,s:6}),
 steps:[['ছাত্রী সংখ্যা','1ম ক্ষেত্রে 6(b − 2), 2য় ক্ষেত্রে 5b + 6'],['সমীকরণ','6(b − 2) = 5b + 6 ⟹ 6b − 12 = 5b + 6'],['সমাধান','b = 18']],
 chk:'যাচাই: ছাত্রী = 5 × 18 + 6 = 96 এবং 6 × 16 = 96 ✓',
 ans:[{l:'বেঞ্চ',v:18,u:'টি'}],fin:'বেঞ্চের সংখ্যা 18'},

{id:'c5-p21',sec:'c51',no:'৫.১ — ২১',k:'e',gist:'লঞ্চের কেবিন ও ডেকের যাত্রী',
 q:'একটি লঞ্চে যাত্রী সংখ্যা 47। মাথাপিছু কেবিনের ভাড়া ডেকের ভাড়ার দ্বিগুণ। ডেকের ভাড়া মাথাপিছু 30 টাকা এবং মোট ভাড়া প্রাপ্তি 1680 টাকা হলে, কেবিনের যাত্রী সংখ্যা কত?',
 f:['মোট ভাড়া = কেবিন যাত্রী × 60 + ডেক যাত্রী × 30'],
 idea:'কেবিনের ভাড়া 2 × 30 = 60। কেবিনে x জন হলে ডেকে (47 − x) জন।',
 dia:()=>D.hbars({rows:[{l:'যাত্রী 47 জন',seg:[{w:1,t:'কেবিন x জন',k:'o'},{w:2,t:'ডেক (47 − x) জন',k:'g'}]},{l:'ভাড়া 1680 টাকা',seg:[{w:1,t:'60x',k:'o'},{w:2,t:'30(47 − x)',k:'g'}]}]}),
 steps:[['ভাড়া','কেবিন 60 টাকা, ডেক 30 টাকা'],['সমীকরণ','60x + 30(47 − x) = 1680'],['সরল','60x + 1410 − 30x = 1680 ⟹ 30x = 270'],['সমাধান','x = 9']],
 chk:'যাচাই: 9 × 60 + 38 × 30 = 540 + 1140 = 1680 ✓',
 ans:[{l:'কেবিনের যাত্রী',v:9,u:'জন'}],fin:'কেবিনের যাত্রী 9 জন'},

{id:'c5-p22',sec:'c51',no:'৫.১ — ২২',k:'e',gist:'২৫ পয়সা ও ৫০ পয়সার মুদ্রা',
 q:'মোট 120 টি পঁচিশ পয়সার মুদ্রা ও পঞ্চাশ পয়সার মুদ্রায় মোট 35 টাকা হলে, কোন প্রকারের মুদ্রার সংখ্যা কয়টি?',

 dia:()=>D.hbars({rows:[{l:'মোট 120 টি মুদ্রা',seg:[{w:1,t:'25 পয়সা: x টি',k:'o'},{w:2,t:'50 পয়সা: (120 − x) টি',k:'g'}]},{l:'মোট 3500 পয়সা',seg:[{w:1,t:'25x',k:'o'},{w:2,t:'50(120 − x)',k:'g'}]}]}),
 steps:[['একক','35 টাকা = 3500 পয়সা'],['সমীকরণ','25x + 50(120 − x) = 3500'],['সরল','6000 − 25x = 3500 ⟹ 25x = 2500 ⟹ x = 100'],['অপরটি','120 − 100 = 20']],
